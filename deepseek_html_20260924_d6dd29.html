<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Story Platform — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BASE
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #0a0a0a;
  color: #e5e5e5;
  line-height: 1.5;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #0a0a0a; }
::-webkit-scrollbar-thumb { background: #262626; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

/* ============================================================
   LAYOUT
   ============================================================ */
.admin {
  display: grid;
  grid-template-columns: 340px 1fr;
  grid-template-rows: 56px 1fr;
  height: 100vh;
  width: 100vw;
}
.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: #111;
  border-bottom: 1px solid #262626;
  z-index: 10;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.topbar-logo {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
}
.topbar-logo span { color: #f59e0b; font-weight: 400; }
.topbar-badge {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 4px 10px;
  background: #f59e0b;
  color: #000;
  border-radius: 4px;
  font-weight: 700;
}
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.tb-btn {
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid #262626;
  background: #161616;
  color: #e5e5e5;
  transition: all 0.15s;
}
.tb-btn:hover { background: #1f1f1f; border-color: #3a3a3a; }
.tb-btn.primary { background: #f59e0b; color: #000; border-color: #f59e0b; font-weight: 600; }
.tb-btn.primary:hover { background: #fbbf24; }
.tb-btn.danger { color: #f87171; border-color: #3a1a1a; }
.tb-btn.danger:hover { background: #1f0f0f; }

/* ============================================================
   SIDEBAR (file tree)
   ============================================================ */
.sidebar {
  background: #0f0f0f;
  border-right: 1px solid #262626;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.sidebar-head {
  padding: 14px 16px;
  border-bottom: 1px solid #1a1a1a;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: #0f0f0f;
  z-index: 5;
}
.sidebar-head h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #737373;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
}
.sidebar-filter {
  padding: 10px 16px;
  border-bottom: 1px solid #1a1a1a;
}
.sidebar-filter input {
  width: 100%;
  padding: 8px 12px;
  background: #161616;
  border: 1px solid #262626;
  border-radius: 6px;
  color: #e5e5e5;
  font-size: 12px;
  outline: none;
}
.sidebar-filter input:focus { border-color: #f59e0b; }

.tree { padding: 8px 0 24px; }
.tree-group { margin-bottom: 4px; }
.tree-group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #737373;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
}
.tree-group-header:hover { color: #a3a3a3; }
.tree-group-header .arrow { transition: transform 0.15s; font-size: 9px; }
.tree-group.collapsed .tree-group-header .arrow { transform: rotate(-90deg); }
.tree-group.collapsed .tree-items { display: none; }
.tree-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px 7px 28px;
  font-size: 12.5px;
  color: #a3a3a3;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.12s;
  user-select: none;
}
.tree-item:hover { background: #161616; color: #e5e5e5; }
.tree-item.active {
  background: #1a1a1a;
  color: #f59e0b;
  border-left-color: #f59e0b;
}
.tree-item .icon { font-size: 12px; opacity: 0.7; width: 14px; text-align: center; }
.tree-item .label { flex: 1; }
.tree-item .count {
  font-size: 10px;
  background: #1f1f1f;
  padding: 1px 6px;
  border-radius: 8px;
  color: #737373;
}
.tree-item.active .count { background: #2a1f08; color: #f59e0b; }

/* ============================================================
   MAIN PANEL
   ============================================================ */
.main-panel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
}
.editor-pane, .preview-pane {
  overflow-y: auto;
  padding: 24px;
}
.editor-pane { border-right: 1px solid #262626; background: #0a0a0a; }
.preview-pane { background: #0f0f0f; padding: 0; overflow: hidden; display: flex; flex-direction: column; }

.pane-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid #1a1a1a;
}
.pane-head h1 {
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  font-family: 'Inter', sans-serif;
  letter-spacing: -0.01em;
}
.pane-head .subtitle {
  font-size: 12px;
  color: #737373;
  margin-top: 2px;
}
.pane-head-actions { display: flex; gap: 8px; }

/* ============================================================
   FORM
   ============================================================ */
.form-section {
  margin-bottom: 28px;
  padding-bottom: 24px;
  border-bottom: 1px solid #1a1a1a;
}
.form-section:last-child { border-bottom: none; }
.form-section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #737373;
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.form-section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #1a1a1a;
}

.field {
  margin-bottom: 16px;
}
.field:last-child { margin-bottom: 0; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: #a3a3a3;
  margin-bottom: 6px;
}
.field label .hint {
  font-weight: 400;
  color: #525252;
  font-size: 11px;
  margin-left: 6px;
}
.field input[type="text"],
.field input[type="number"],
.field input[type="url"],
.field textarea,
.field select {
  width: 100%;
  padding: 9px 12px;
  background: #161616;
  border: 1px solid #262626;
  border-radius: 6px;
  color: #e5e5e5;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: #f59e0b; }
.field textarea {
  resize: vertical;
  min-height: 80px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.6;
}
.field .color-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.field input[type="color"] {
  width: 44px;
  height: 38px;
  border: 1px solid #262626;
  border-radius: 6px;
  background: #161616;
  cursor: pointer;
  padding: 2px;
}
.field input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.field input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
.field .color-value {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

/* Buttons list */
.btn-list { display: flex; flex-direction: column; gap: 8px; }
.btn-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: #111;
  border: 1px solid #1f1f1f;
  border-radius: 8px;
  transition: border-color 0.15s;
}
.btn-row:hover { border-color: #2f2f2f; }
.btn-row .swatch {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.btn-row .info { flex: 1; min-width: 0; }
.btn-row .info .name { font-size: 13px; font-weight: 500; color: #e5e5e5; }
.btn-row .info .meta { font-size: 11px; color: #525252; margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
.btn-row .actions { display: flex; gap: 4px; }
.icon-mini {
  width: 30px;
  height: 30px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: #737373;
  border: 1px solid transparent;
  transition: all 0.12s;
}
.icon-mini:hover { background: #1f1f1f; color: #e5e5e5; border-color: #2f2f2f; }
.icon-mini.danger:hover { color: #f87171; border-color: #3a1a1a; background: #1a0f0f; }

/* Preview toolbar */
.preview-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #111;
  border-bottom: 1px solid #262626;
  flex-shrink: 0;
}
.preview-toolbar-left { display: flex; align-items: center; gap: 8px; }
.preview-toolbar h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #737373;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
}
.device-tabs { display: flex; background: #0a0a0a; border-radius: 6px; padding: 2px; border: 1px solid #1f1f1f; }
.device-tab {
  padding: 5px 10px;
  font-size: 11px;
  border-radius: 4px;
  color: #737373;
  transition: all 0.12s;
}
.device-tab.active { background: #1f1f1f; color: #e5e5e5; }
.device-tab:hover:not(.active) { color: #a3a3a3; }

.preview-viewport {
  flex: 1;
  overflow: auto;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background:
    linear-gradient(45deg, #0f0f0f 25%, transparent 25%),
    linear-gradient(-45deg, #0f0f0f 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #0f0f0f 75%),
    linear-gradient(-45deg, transparent 75%, #0f0f0f 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  background-color: #131313;
}
.device-frame {
  width: 100%;
  max-width: 1200px;
  background: var(--preview-bg, #faf9f7);
  color: var(--preview-text, #1a1a18);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  transition: max-width 0.3s;
  font-family: 'Inter', system-ui, sans-serif;
}
.device-frame.mobile { max-width: 390px; }
.device-frame.tablet { max-width: 768px; }
.device-frame iframe {
  width: 100%;
  height: 700px;
  border: none;
  display: block;
  background: var(--preview-bg, #faf9f7);
}

/* ============================================================
   MODAL
   ============================================================ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.15s ease-out;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
.modal {
  background: #111;
  border: 1px solid #262626;
  border-radius: 12px;
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  animation: slideUp 0.2s ease-out;
}
.modal h3 {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 4px;
  font-family: 'Inter', sans-serif;
}
.modal .modal-sub {
  font-size: 12px;
  color: #737373;
  margin-bottom: 20px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid #1a1a1a;
}

/* ============================================================
   TOAST
   ============================================================ */
.toast-stack {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 12px 18px;
  background: #1a1a1a;
  border: 1px solid #2f2f2f;
  border-left: 3px solid #f59e0b;
  border-radius: 8px;
  font-size: 13px;
  color: #e5e5e5;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  animation: slideUp 0.25s ease-out;
  min-width: 240px;
}
.toast.success { border-left-color: #22c55e; }
.toast.danger { border-left-color: #ef4444; }

/* ============================================================
   MISC
   ============================================================ */
.empty-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 40px;
  text-align: center;
  color: #737373;
}
.empty-panel .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-panel h3 { font-size: 16px; color: #a3a3a3; margin-bottom: 8px; font-family: 'Inter', sans-serif; }
.empty-panel p { font-size: 13px; max-width: 360px; line-height: 1.6; }

.changes-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  background: #2a1f08;
  color: #f59e0b;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.changes-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #f59e0b;
}

@media (max-width: 900px) {
  .admin { grid-template-columns: 1fr; grid-template-rows: 56px auto 1fr; }
  .sidebar { max-height: 200px; }
  .main-panel { grid-template-columns: 1fr; }
  .editor-pane { border-right: none; border-bottom: 1px solid #262626; }
  .preview-pane { min-height: 500px; }
}
</style>
</head>
<body>

<div class="admin">
  <!-- ==================== TOPBAR ==================== -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">Story<span>Platform</span></div>
      <span class="topbar-badge">Admin</span>
      <span id="changesBadge" class="changes-badge" style="display:none;">Unsaved changes</span>
    </div>
    <div class="topbar-actions">
      <button class="tb-btn" onclick="resetAll()">↺ Reset</button>
      <button class="tb-btn" onclick="exportJSON()">⬇ Export</button>
      <button class="tb-btn" onclick="importJSON()">⬆ Import</button>
      <button class="tb-btn primary" onclick="saveAll()">💾 Save</button>
    </div>
  </div>

  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <h2>Components</h2>
      <span id="itemCount" style="font-size:11px;color:#525252;"></span>
    </div>
    <div class="sidebar-filter">
      <input type="text" id="treeFilter" placeholder="Filter components…" />
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <!-- ==================== MAIN ==================== -->
  <div class="main-panel">
    <!-- EDITOR -->
    <div class="editor-pane" id="editorPane">
      <div class="empty-panel">
        <div class="icon">←</div>
        <h3>Select a component</h3>
        <p>Choose any component from the left sidebar to edit its text, colors, sizes, and behavior. Changes update the live preview instantly.</p>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview-pane">
      <div class="preview-toolbar">
        <div class="preview-toolbar-left">
          <h2>Live Preview</h2>
          <span id="previewRoute" style="font-size:11px;color:#525252;font-family:'JetBrains Mono',monospace;"></span>
        </div>
        <div class="device-tabs">
          <button class="device-tab active" data-device="desktop" onclick="setDevice('desktop')">🖥 Desktop</button>
          <button class="device-tab" data-device="tablet" onclick="setDevice('tablet')">📱 Tablet</button>
          <button class="device-tab" data-device="mobile" onclick="setDevice('mobile')">📱 Mobile</button>
        </div>
      </div>
      <div class="preview-viewport">
        <div class="device-frame" id="deviceFrame">
          <iframe id="previewFrame"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   EDITABLE COMPONENT REGISTRY
   Each entry: id, group, label, icon, route (for preview), fields
   Field types: text, textarea, number, color, url, select
   ============================================================ */

const DEFAULT_CONFIG = {
  // ---------- GLOBAL THEME ----------
  "theme.bg":         { group: "Theme", label: "Background",      icon: "🎨", type: "color", value: "#faf9f7" },
  "theme.surface":    { group: "Theme", label: "Surface",         icon: "🎨", type: "color", value: "#f4f2ee" },
  "theme.surface2":   { group: "Theme", label: "Surface 2",       icon: "🎨", type: "color", value: "#e9e6df" },
  "theme.text":       { group: "Theme", label: "Text",            icon: "🎨", type: "color", value: "#1a1a18" },
  "theme.textMuted":  { group: "Theme", label: "Muted text",      icon: "🎨", type: "color", value: "#6b6862" },
  "theme.border":     { group: "Theme", label: "Border",          icon: "🎨", type: "color", value: "#e3e0d9" },
  "theme.accent":     { group: "Theme", label: "Accent",          icon: "🎨", type: "color", value: "#b45309" },
  "theme.radius":     { group: "Theme", label: "Border radius (px)", icon: "🎨", type: "number", value: 16 },

  // ---------- NAVBAR ----------
  "nav.logoText":     { group: "Navbar", label: "Logo text",        icon: "🧭", type: "text",  value: "Story" },
  "nav.logoAccent":   { group: "Navbar", label: "Logo accent",      icon: "🧭", type: "text",  value: "Platform" },
  "nav.link1":        { group: "Navbar", label: "Link 1",           icon: "🧭", type: "text",  value: "Stories" },
  "nav.link2":        { group: "Navbar", label: "Link 2",           icon: "🧭", type: "text",  value: "Categories" },
  "nav.link3":        { group: "Navbar", label: "Link 3",           icon: "🧭", type: "text",  value: "Authors" },
  "nav.link4":        { group: "Navbar", label: "Link 4",           icon: "🧭", type: "text",  value: "Library" },
  "nav.ctaText":      { group: "Navbar", label: "CTA button text",  icon: "🧭", type: "text",  value: "Dashboard" },
  "nav.ctaBg":        { group: "Navbar", label: "CTA background",   icon: "🧭", type: "color", value: "#b45309" },
  "nav.ctaTextColor": { group: "Navbar", label: "CTA text color",   icon: "🧭", type: "color", value: "#ffffff" },
  "nav.height":       { group: "Navbar", label: "Navbar height (px)", icon: "🧭", type: "number", value: 64 },

  // ---------- HERO ----------
  "hero.eyebrow":     { group: "Hero", label: "Eyebrow text",  icon: "🏔", type: "text",     value: "Issue No. 12 · January 2026" },
  "hero.title":       { group: "Hero", label: "Headline",      icon: "🏔", type: "textarea", value: "Stories worth\nslowing down for." },
  "hero.lead":        { group: "Hero", label: "Lead paragraph", icon: "🏔", type: "textarea", value: "A curated home for short fiction, essays, and quiet epics. Read, save, and follow the writers you love." },
  "hero.cta1":        { group: "Hero", label: "CTA 1 text",    icon: "🏔", type: "text",     value: "Start reading" },
  "hero.cta1Bg":      { group: "Hero", label: "CTA 1 background", icon: "🏔", type: "color", value: "#b45309" },
  "hero.cta1Text":    { group: "Hero", label: "CTA 1 text color", icon: "🏔", type: "color", value: "#ffffff" },
  "hero.cta2":        { group: "Hero", label: "CTA 2 text",    icon: "🏔", type: "text",     value: "Meet the authors" },
  "hero.badgeTitle":  { group: "Hero", label: "Badge title",   icon: "🏔", type: "text",     value: "The Cartographer's Daughter" },
  "hero.badgeAuthor": { group: "Hero", label: "Badge author",  icon: "🏔", type: "text",     value: "by Elena Marchetti" },

  // ---------- STORY CARD ----------
  "storyCard.radius":     { group: "Story Card", label: "Cover radius (px)", icon: "📖", type: "number", value: 20 },

// Which config keys affect which route (for preview navigation)
const ROUTE_FOR_GROUP = {
  "Theme": "/", "Navbar": "/", "Hero": "/", "Story Card": "/", "Author Card": "/",
  "Category Card": "/", "Buttons": "/", "Footer": "/", "Mobile Nav": "/",
  "Reader": "/story/the-cartographers-daughter",
  "Empty State": "/library", "404 Page": "/404", "Dashboard": "/dashboard"
};

/* ============================================================
   STATE
   ============================================================ */
let config = loadConfig();
let activeKey = null;
let filterText = "";
let currentDevice = "desktop";

function loadConfig() {
  try {
    const saved = localStorage.getItem("admin.config");
    if (saved) return { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
  } catch {}
  return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
}

function saveConfig() {
  localStorage.setItem("admin.config", JSON.stringify(config));
  localStorage.setItem("admin.savedAt", new Date().toISOString());
}

function resetAll() {
  if (!confirm("Reset all edits to defaults? This cannot be undone.")) return;
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  localStorage.removeItem("admin.config");
  activeKey = null;
  renderTree();
  renderEditor();
  updatePreview();
  showToast("Reset to defaults", "success");
  updateChangesBadge();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "story-platform-config.json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("Config exported", "success");
}

function importJSON() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        config = { ...DEFAULT_CONFIG, ...imported };
        saveConfig();
        renderTree();
        renderEditor();
        updatePreview();
        showToast("Config imported", "success");
      } catch {
        showToast("Invalid JSON file", "danger");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function saveAll() {
  saveConfig();
  showToast("Changes saved", "success");
  updateChangesBadge();
}

function updateChangesBadge() {
  const saved = localStorage.getItem("admin.config");
  const hasChanges = saved !== JSON.stringify(config);
  document.getElementById("changesBadge").style.display = hasChanges ? "inline-flex" : "none";
}

/* ============================================================
   TREE (sidebar)
   ============================================================ */
function renderTree() {
  const groups = {};
  Object.entries(config).forEach(([key, item]) => {
    if (!groups[item.group]) groups[item.group] = [];
    groups[item.group].push({ key, ...item });
  });

  const filter = filterText.trim().toLowerCase();
  const tree = document.getElementById("tree");
  let html = "";
  let total = 0;
  const groupOrder = ["Theme","Navbar","Hero","Buttons","Story Card","Author Card","Category Card","Reader","Empty State","404 Page","Dashboard","Footer","Mobile Nav"];

  const sortedGroups = Object.keys(groups).sort((a, b) => {
    const ia = groupOrder.indexOf(a);
    const ib = groupOrder.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  sortedGroups.forEach((g) => {
    const items = groups[g].filter((it) =>
      !filter || it.label.toLowerCase().includes(filter) || g.toLowerCase().includes(filter) || it.key.toLowerCase().includes(filter)
    );
    if (items.length === 0) return;
    total += items.length;

    html += `<div class="tree-group" data-group="${g}">`;
    html += `<div class="tree-group-header" onclick="toggleGroup(this)">
      <span class="arrow">▼</span>
      <span>${g}</span>
      <span class="count" style="margin-left:auto;">${items.length}</span>
    </div>`;
    html += `<div class="tree-items">`;
    items.forEach((it) => {
      const isActive = it.key === activeKey;
      html += `<div class="tree-item ${isActive ? "active" : ""}" data-key="${it.key}" onclick="selectKey('${it.key}')">
        <span class="icon">${it.icon || "•"}</span>
        <span class="label">${escapeHtml(it.label)}</span>
      </div>`;
    });
    html += `</div></div>`;
  });

  tree.innerHTML = html;
  document.getElementById("itemCount").textContent = `${total} items`;
}

function toggleGroup(el) {
  el.parentElement.classList.toggle("collapsed");
}

function selectKey(key) {
  activeKey = key;
  renderTree();
  renderEditor();
  updatePreview();
}

/* ============================================================
   EDITOR
   ============================================================ */
function renderEditor() {
  const pane = document.getElementById("editorPane");
  if (!activeKey || !config[activeKey]) {
    pane.innerHTML = `
      <div class="empty-panel">
        <div class="icon">←</div>
        <h3>Select a component</h3>
        <p>Choose any component from the left sidebar to edit its text, colors, sizes, and behavior. Changes update the live preview instantly.</p>
      </div>`;
    return;
  }

  const item = config[activeKey];
  const groupItems = Object.entries(config).filter(([, v]) => v.group === item.group);

  let fieldsHtml = "";
  groupItems.forEach(([key, it]) => {
    fieldsHtml += renderField(key, it);
  });

  pane.innerHTML = `
    <div class="pane-head">
      <div>
        <h1>${item.icon || "•"} ${escapeHtml(item.group)}</h1>
        <div class="subtitle">Editing: <span style="color:#f59e0b;font-family:'JetBrains Mono',monospace;">${escapeHtml(activeKey)}</span></div>
      </div>
      <div class="pane-head-actions">
        <button class="tb-btn" onclick="resetKey('${activeKey}')">↺ Reset field</button>
      </div>
    </div>
    <div class="form-section">
      <div class="form-section-title">${escapeHtml(item.group)} settings</div>
      ${fieldsHtml}
    </div>
    <div class="form-section">
      <div class="form-section-title">Actions</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="tb-btn" onclick="copyKey('${activeKey}')">📋 Copy key</button>
        <button class="tb-btn" onclick="copyValue('${activeKey}')">📋 Copy value</button>
        <button class="tb-btn" onclick="jumpToPreview('${item.group}')">👁 Preview this</button>
      </div>
    </div>
  `;
}

function renderField(key, item) {
  const val = item.value;
  let input = "";

  if (item.type === "color") {
    input = `
      <div class="color-row">
        <input type="color" value="${val}" oninput="updateValue('${key}', this.value)" />
        <input type="text" class="color-value" value="${val}" oninput="updateValue('${key}', this.value)" />
      </div>`;
  } else if (item.type === "textarea") {
    input = `<textarea oninput="updateValue('${key}', this.value)">${escapeHtml(val)}</textarea>`;
  } else if (item.type === "number") {
    input = `<input type="number" value="${val}" step="${item.step || 1}" oninput="updateValue('${key}', parseFloat(this.value) || 0)" />`;
  } else if (item.type === "select") {
    input = `<select onchange="updateValue('${key}', this.value)">
      ${item.options.map((o) => `<option value="${o}" ${o === val ? "selected" : ""}>${o}</option>`).join("")}
    </select>`;
  } else {
    input = `<input type="text" value="${escapeHtml(val)}" oninput="updateValue('${key}', this.value)" />`;
  }

  return `
    <div class="field">
      <label>${escapeHtml(item.label)} <span class="hint">${key}</span></label>
      ${input}
    </div>
  `;
}

function updateValue(key, value) {
  config[key].value = value;
  updateChangesBadge();
  updatePreview();
  // Re-render editor only if the same key's color text field needs sync (skip to avoid losing focus)
  // But we do need to update the color input's text sibling if it's a color field
}

function resetKey(key) {
  config[key].value = DEFAULT_CONFIG[key].value;
  renderEditor();
  updatePreview();
  showToast(`Reset ${key}`, "success");
  updateChangesBadge();
}

function copyKey(key) {
  navigator.clipboard.writeText(key);
  showToast(`Copied key: ${key}`, "success");
}
function copyValue(key) {
  navigator.clipboard.writeText(String(config[key].value));
  showToast("Value copied", "success");
}
function jumpToPreview(group) {
  const route = ROUTE_FOR_GROUP[group] || "/";
  const frame = document.getElementById("previewFrame");
  frame.contentWindow.postMessage({ type: "navigate", route }, "*");
  document.getElementById("previewRoute").textContent = route;
}

<script>

let previewHTML = "";

function updatePreview() {
  const frame = document.getElementById("previewFrame");
  previewHTML = buildPreviewHTML();
  frame.srcdoc = previewHTML;
}

function setDevice(device) {
  currentDevice = device;
  document.querySelectorAll(".device-tab").forEach((t) => t.classList.toggle("active", t.dataset.device === device));
  const frame = document.getElementById("deviceFrame");
  frame.classList.remove("mobile", "tablet");
  if (device === "mobile") frame.classList.add("mobile");
  else if (device === "tablet") frame.classList.add("tablet");
}

/* ============================================================
   TOAST
   ============================================================ */
function showToast(msg, type = "") {
  const stack = document.getElementById("toastStack");
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity 0.3s, transform 0.3s";
    el.style.opacity = "0";
    el.style.transform = "translateX(20px)";
    setTimeout(() => el.remove(), 300);
  }, 2200);
}

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById("treeFilter").addEventListener("input", (e) => {
  filterText = e.target.value;
  renderTree();
});

renderTree();
updatePreview();
updateChangesBadge();

// Keyboard: Ctrl+S to save
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    saveAll();
  }
});

// Expose functions

window.toggleGroup = toggleGroup;
window.updateValue = updateValue;

window.copyKey = copyKey;
