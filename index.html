function onGlobalClick(e){
  const target = e.target.closest('[data-action]');
  if(!target) return;

  const action = target.dataset.action;
  const id = target.dataset.id;
  const ci = Number(target.dataset.ci);
  const si = Number(target.dataset.si);
  const bi = Number(target.dataset.bi);
  const editor = state.editor;

  switch(action){

    case 'open-story': location.hash = '#/story/' + id; break;

    case 'toggle-menu': {
      const nav = $('#mainNav');
      const open = nav.classList.toggle('open');
      target.setAttribute('aria-expanded', String(open));
      break;
    }
    case 'set-category':
      state.category = target.dataset.cat || 'सभी';
      refreshListings();
      break;
    case 'clear-filters': {
      state.search = ''; state.category = 'सभी';
      const a = $('#searchInput'); if(a) a.value = '';
      const b = $('#listingSearch'); if(b) b.value = '';
      refreshListings();
      break;
    }

    case 'like': toggleLike(id); break;
    case 'bookmark': toggleBookmark(id); break;
    case 'share': shareStory(id); break;
    case 'font-smaller': setFontSize(state.prefs.fontSize - 1); break;
    case 'font-larger':  setFontSize(state.prefs.fontSize + 1); break;
    case 'set-theme':    setReaderTheme(target.dataset.theme); break;
    case 'toggle-toc': {
      const toc = $('#toc');
      if(!toc) return;
      target.setAttribute('aria-expanded', String(toc.classList.toggle('open')));
      break;
    }

    /* ADMIN */
    case 'admin-tab':
      state.adminTab = target.dataset.tab || 'dashboard';
      renderAdmin();
      break;

    case 'new-story': startNewStory(); break;
    case 'edit-story': startEditStory(id); break;
    case 'delete-story': deleteStory(id); break;
    case 'duplicate-story': duplicateStory(id); break;
    case 'toggle-publish': togglePublish(id); break;
    case 'export-json': exportJSON(); break;
    case 'reset-data': resetToSamples(); break;

    case 'save-settings':
      saveSettings();
      applySettingsToChrome();
      toast('साइट सेटिंग्स सहेज दी गईं।');
      break;

    case 'cat-add': {
      const inp = $('#newCatInput');
      const name = inp ? inp.value.trim() : '';
      if(!name){ toast('कृपया श्रेणी का नाम लिखें।'); return; }
      if(state.settings.categories.includes(name)){ toast('यह श्रेणी पहले से मौजूद है।'); return; }
      state.settings.categories.push(name);
      saveSettings();
      renderAdminTab('categories');
      toast('श्रेणी जोड़ दी गई।');
      break;
    }
    case 'cat-delete': {
      const idx = Number(target.dataset.index);
      const cats = state.settings.categories;
      if(cats.length <= 1){ toast('कम से कम एक श्रेणी आवश्यक है।'); return; }
      const name = cats[idx];
      const used = state.stories.filter(s => s.category === name).length;
      const msg = used
        ? `“${name}” श्रेणी में ${used} कहानियाँ हैं। उन्हें पहली श्रेणी में स्थानांतरित करके हटाएँ?`
        : `“${name}” श्रेणी हटाएँ?`;
      if(!confirm(msg)) return;
      cats.splice(idx, 1);
      const fallback = cats[0];
      state.stories.forEach(s => { if(s.category === name) s.category = fallback; });
      if(state.category === name) state.category = 'सभी';
      saveSettings(); saveStories();
      renderAdminTab('categories');
      toast('श्रेणी हटा दी गई।');
      break;
    }

    case 'delete-image':
      deleteImage(target.dataset.imgid);
      break;

    case 'copy-img-id': {
      const imgId = target.dataset.imgid;
      try{
        navigator.clipboard.writeText(imgId).then(() => toast('चित्र आईडी कॉपी हो गई।'));
      }catch(e){ toast('कॉपी नहीं हो सका।'); }
      break;
    }

    /* EDITOR */
    case 'editor-save': saveEditor(); break;
    case 'editor-cancel': cancelEditor(); break;
    case 'editor-preview': openPreview(); break;
    case 'close-preview': closePreview(); break;
    case 'pick-cover': pickImage({ kind: 'cover' }); break;
    case 'remove-cover':
      if(!editor) return;
      if(!confirm('आवरण चित्र हटाएँ?')) return;
      editor.story.coverImageId = null;
      rerenderEditor();
      break;

    case 'chapter-add': addChapter(); break;
    case 'chapter-up':
      if(!editor) return;
      moveItem(editor.story.chapters, ci, ci - 1);
      rerenderEditor();
      break;
    case 'chapter-down':
      if(!editor) return;
      moveItem(editor.story.chapters, ci, ci + 1);
      rerenderEditor();
      break;
    case 'chapter-delete':
      if(!editor) return;
      if(!confirm('यह अध्याय और इसके सभी उप-अध्याय हटाएँ?')) return;
      editor.story.chapters.splice(ci, 1);
      rerenderEditor();
      break;

    case 'sub-add': addSubchapter(ci); break;
    case 'sub-up':
      if(!editor) return;
      moveItem(editor.story.chapters[ci].subchapters, si, si - 1);
      rerenderEditor();
      break;
    case 'sub-down':
      if(!editor) return;
      moveItem(editor.story.chapters[ci].subchapters, si, si + 1);
      rerenderEditor();
      break;
    case 'sub-delete':
      if(!editor) return;
      if(!confirm('यह उप-अध्याय हटाएँ?')) return;
      editor.story.chapters[ci].subchapters.splice(si, 1);
      rerenderEditor();
      break;

    case 'block-add-text': addBlockText(ci, si); break;
    case 'block-add-image': pickImage({ kind: 'block', ci, si }); break;
    case 'block-replace-image': pickImage({ kind: 'block', ci, si, bi }); break;
    case 'block-up':
      if(!editor) return;
      moveItem(editor.story.chapters[ci].subchapters[si].blocks, bi, bi - 1);
      rerenderEditor();
      break;
    case 'block-down':
      if(!editor) return;
      moveItem(editor.story.chapters[ci].subchapters[si].blocks, bi, bi + 1);
      rerenderEditor();
      break;
    case 'block-delete':
      if(!editor) return;
      editor.story.chapters[ci].subchapters[si].blocks.splice(bi, 1);
      rerenderEditor();
      break;

    default: break;
  }
}

function onGlobalInput(e){
  const t = e.target;

  if(t.matches('[data-bind]')){
    if(!state.editor) return;
    const path = t.dataset.bind;
    const value = (t.type === 'checkbox') ? t.checked : t.value;
    setPath(state.editor.story, path, value);
    return;
  }

  if(t.matches('[data-setting]')){
    const path = t.dataset.setting;
    let value;
    if(t.type === 'checkbox') value = t.checked;
    else if(t.type === 'number') value = Number(t.value) || 0;
    else value = t.value;
    setPath(state.settings, path, value);
    return;
  }

  if(t.id === 'searchInput'){
    state.search = t.value;
    renderHomeDynamic();
    return;
  }
  if(t.id === 'listingSearch'){
    state.search = t.value;
    renderListingGrid();
    return;
  }
  if(t.id === 'adminSearch'){
    state.adminSearch = t.value;
    const host = $('#adminTabHost');
    if(host && state.adminTab === 'stories'){
      host.innerHTML = storiesTabHTML();
    }
    return;
  }
}

function onGlobalChange(e){
  const t = e.target;

  if(t.matches('[data-setting]')){
    const path = t.dataset.setting;
    let value;
    if(t.type === 'checkbox') value = t.checked;
    else if(t.type === 'number') value = Number(t.value) || 0;
    else value = t.value;
    setPath(state.settings, path, value);
    saveSettings();
    applySettingsToChrome();
    return;
  }

  if(t.matches('[data-cat-index]')){
    const idx = Number(t.dataset.catIndex);
    const oldName = state.settings.categories[idx];
    const newName = t.value.trim();
    if(!newName){ toast('श्रेणी का नाम खाली नहीं हो सकता।'); t.value = oldName; return; }
    if(newName === oldName) return;
    if(state.settings.categories.includes(newName)){
      toast('यह श्रेणी पहले से मौजूद है।');
      t.value = oldName;
      return;
    }
    state.settings.categories[idx] = newName;
    state.stories.forEach(s => { if(s.category === oldName) s.category = newName; });
    saveSettings(); saveStories();
    renderAdminTab('categories');
    toast('श्रेणी बदल दी गई।');
    return;
  }

  if(t.id === 'listingSort'){
    state.sort = t.value;
    renderListingGrid();
    return;
  }

  if(t.id === 'adminFilter'){
    state.adminFilter = t.value;
    const host = $('#adminTabHost');
    if(host) host.innerHTML = storiesTabHTML();
    return;
  }
  if(t.id === 'adminSort'){
    state.adminSort = t.value;
    const host = $('#adminTabHost');
    if(host) host.innerHTML = storiesTabHTML();
    return;
  }

  if(t.id === 'fileInput'){
    handleImageFile(t.files && t.files[0]);
    return;
  }
}

function onGlobalKey(e){
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-action="open-story"]')){
    e.preventDefault();
    e.target.click();
    return;
  }
  if(e.key === 'Escape'){
    if($('#previewOverlay')) closePreview();
    closeMobileNav();
  }
}

/* ============================================================================
   28. BOOTSTRAP
   ============================================================================ */

async function init(){
  loadSettings();
  const hasPrefs = loadPrefs();
  loadUser();
  try{ db = await openDB(); }
  catch(err){ db = null; console.warn('IndexedDB unavailable — image uploads disabled.', err); }
  let stored = null;
  try{ stored = localStorage.getItem(LS_STORIES); }catch(e){ stored = null; }
  if(stored !== null){
    try{ const parsed=JSON.parse(stored); state.stories=Array.isArray(parsed)?parsed:[]; }catch(e){ state.stories=[]; }
  }
  let loadedCloud=false;
  try{ loadedCloud=await loadCloudContent(); }
  catch(err){ console.warn('Supabase unavailable; using local cached content.',err); }
  if(!loadedCloud && stored === null){ await seedData(); }
  if(!hasPrefs){ state.prefs.fontSize=state.settings.reader.fontSize; state.prefs.theme=state.settings.reader.theme; }
  await loadImages(); await hydrateRemoteImageURLs();
  applySettingsToChrome();
  document.addEventListener('click', onGlobalClick);
  document.addEventListener('input', onGlobalInput);
  document.addEventListener('change', onGlobalChange);
  document.addEventListener('keydown', onGlobalKey);
  window.addEventListener('hashchange', render);
  render();
}

init();

})();
</script>
