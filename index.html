<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f18" />
<meta name="description" content="कथा संसार — हिंदी कहानियों का एक प्रीमियम डिजिटल मंच।" />
<title>कथा संसार</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Mukta:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root{
  --bg:#0a0f18;
  --bg-2:#0f1626;
  --card:#131c2e;
  --card-2:#182338;
  --line: rgba(226,192,122,.18);
  --line-soft: rgba(255,255,255,.07);
  --gold:#e2c07a;
  --gold-dim:#b99a58;
  --text:#e8e4dc;
  --muted:#93a0b8;
  --danger:#e26d6d;
  --ok:#6fd39a;
  --info:#8fb6f0;
  --radius:18px;
  --shadow: 0 22px 50px -26px rgba(0,0,0,.9);
  --serif:'Noto Serif Devanagari', Georgia, 'Times New Roman', serif;
  --sans:'Mukta', 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
}

html{ scroll-behavior:smooth; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:16.5px; line-height:1.65;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
img{ max-width:100%; }
a{ color:inherit; }
h1,h2,h3,h4{ font-family:var(--serif); font-weight:600; line-height:1.3; margin:0; }
p{ margin:0; }
button{ font-family:var(--sans); }

.container{ width:100%; max-width:1220px; margin:0 auto; padding:0 20px; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:6px; }

/* ============================================================
   HEADER
   ============================================================ */
.site-header{
  position:sticky; top:0; z-index:80;
  background:rgba(10,15,24,.86);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line-soft);
}
.header-inner{
  max-width:1220px; margin:0 auto; padding:13px 20px;
  display:flex; align-items:center; gap:18px; position:relative;
}
.brand{
  font-family:var(--serif); font-size:22px; font-weight:700;
  letter-spacing:.4px; text-decoration:none; color:var(--text); white-space:nowrap;
}
.brand span{ color:var(--gold); }
.nav{ display:flex; gap:4px; margin-inline-start:auto; }
.nav a{
  color:var(--muted); text-decoration:none; font-size:15px; font-weight:500;
  padding:8px 13px; border-radius:10px; transition:color .2s, background .2s;
  white-space:nowrap;
}
.nav a:hover{ color:var(--text); background:rgba(226,192,122,.09); }
.nav a.active{ color:var(--gold); background:rgba(226,192,122,.12); }
.header-actions{ display:flex; align-items:center; gap:8px; margin-inline-start:auto; }
.nav + .header-actions{ margin-inline-start:0; }
.menu-toggle{
  display:none; background:transparent; border:1px solid var(--line-soft);
  color:var(--text); width:42px; height:40px; border-radius:11px; cursor:pointer;
  font-size:18px; line-height:1; align-items:center; justify-content:center;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line-soft); background:rgba(255,255,255,.03);
  color:var(--text); padding:9px 16px; border-radius:999px;
  font-size:14.5px; font-weight:500; cursor:pointer; text-decoration:none;
  transition:background .2s, border-color .2s, transform .15s, color .2s;
  line-height:1.4; white-space:nowrap;
}
.btn:hover{ background:rgba(226,192,122,.11); border-color:var(--line); }
.btn:active{ transform:scale(.98); }
.btn-primary{
  background:linear-gradient(135deg,#ecd39a,#d0a95e);
  border-color:transparent; color:#1c1407; font-weight:700;
}
.btn-primary:hover{ filter:brightness(1.06); }
.btn-danger{ color:var(--danger); border-color:rgba(226,109,109,.35); }
.btn-danger:hover{ background:rgba(226,109,109,.13); border-color:rgba(226,109,109,.6); }
.btn-ok{ color:var(--ok); border-color:rgba(111,211,154,.35); }
.btn-ok:hover{ background:rgba(111,211,154,.13); border-color:rgba(111,211,154,.6); }
.btn.active{ background:rgba(226,192,122,.18); border-color:var(--gold); color:var(--gold); }
.btn-sm{ padding:6px 12px; font-size:13px; }
.btn-xs{ padding:4px 9px; font-size:12px; border-radius:8px; }
.btn svg{ flex:0 0 auto; }

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative; overflow:hidden;
  padding:88px 0 68px; text-align:center;
  border-bottom:1px solid var(--line-soft);
  background:
    radial-gradient(900px 420px at 50% -14%, rgba(226,192,122,.17), transparent 70%),
    radial-gradient(700px 520px at 88% 6%, rgba(78,108,180,.13), transparent 72%);
}
.hero-inner{ position:relative; z-index:2; }
.eyebrow{
  display:inline-block; font-size:12.5px; letter-spacing:2.6px; text-transform:uppercase;
  color:var(--gold); font-weight:600; margin-bottom:18px;
  border:1px solid var(--line); border-radius:999px; padding:6px 16px;
  background:rgba(226,192,122,.06);
}
.hero h1{
  font-size:clamp(2rem, 5.2vw, 3.5rem);
  letter-spacing:.5px; line-height:1.24; margin-bottom:16px;
  background:linear-gradient(180deg,#ffffff 20%, #d8cfbe 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero-sub{ color:var(--muted); font-size:clamp(15px,2.2vw,18px); max-width:640px; margin:0 auto; }
.searchbar{
  display:flex; align-items:center; gap:8px;
  max-width:620px; margin:32px auto 0;
  background:var(--card); border:1px solid var(--line);
  border-radius:999px; padding:6px 6px 6px 20px;
  box-shadow:var(--shadow);
  transition:border-color .2s, box-shadow .25s;
}
.searchbar:focus-within{ border-color:var(--gold); box-shadow:0 0 0 4px rgba(226,192,122,.09), var(--shadow); }
.searchbar input[type="search"]{
  flex:1; min-width:0; background:transparent; border:0; outline:none;
  color:var(--text); font-family:var(--sans); font-size:15.5px; padding:8px 0;
}
.searchbar input::placeholder{ color:#6f7c93; }
.searchbar .btn{ flex:0 0 auto; }
.hero-stats{
  display:flex; justify-content:center; gap:26px; flex-wrap:wrap;
  margin-top:34px; color:var(--muted); font-size:13.5px;
}
.hero-stats b{ color:var(--gold); font-weight:600; font-size:17px; display:block; font-family:var(--serif); }

/* ============================================================
   SECTIONS
   ============================================================ */
.section{ padding:52px 0; }
.section-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:16px; margin-bottom:24px; flex-wrap:wrap;
}
.section-head h2{ font-size:clamp(1.35rem,3vw,1.95rem); }
.section-head .sub{ color:var(--muted); font-size:14px; margin-top:5px; }
.section-title{
  font-size:1.25rem; margin:34px 0 18px; color:var(--gold);
  display:flex; align-items:center; gap:10px;
}
.section-title::after{
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg, var(--line), transparent);
}

/* ============================================================
   CHIPS
   ============================================================ */
.chips{ display:flex; flex-wrap:wrap; gap:9px; margin:0 0 26px; }
.chip{
  border:1px solid var(--line-soft); background:rgba(255,255,255,.03);
  color:var(--muted); padding:7px 16px; border-radius:999px;
  font-size:14px; cursor:pointer; transition:all .2s; font-weight:500;
}
.chip:hover{ color:var(--text); border-color:var(--line); }
.chip.active{
  background:rgba(226,192,122,.16); color:var(--gold);
  border-color:var(--gold); font-weight:600;
}
.filterbar{
  display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:20px;
}
.filterbar input[type="search"], .filterbar select{
  background:var(--card); border:1px solid var(--line-soft); color:var(--text);
  border-radius:12px; padding:11px 16px; font-family:var(--sans); font-size:15px;
  outline:none; transition:border-color .2s;
}
.filterbar input[type="search"]{ flex:1; min-width:200px; }
.filterbar input:focus, .filterbar select:focus{ border-color:var(--gold); }
.filterbar .count{ color:var(--muted); font-size:14px; margin-inline-start:auto; }

/* ============================================================
   STORY CARDS
   ============================================================ */
.grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(255px, 1fr)); gap:24px;
}
.card{
  background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius);
  overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
  transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s, border-color .28s;
}
.card:hover, .card:focus-visible{
  transform:translateY(-5px); border-color:var(--line); box-shadow:var(--shadow);
}
.card-cover{ aspect-ratio:16/10; overflow:hidden; background:#0c1320; }
.card-cover img{
  width:100%; height:100%; object-fit:cover; display:block;
  transition:transform .6s cubic-bezier(.2,.7,.3,1);
}
.card:hover .card-cover img{ transform:scale(1.05); }
.card-body{ padding:17px 18px 19px; display:flex; flex-direction:column; gap:9px; flex:1; }
.pill{
  align-self:flex-start; font-size:11.5px; letter-spacing:1px; font-weight:600;
  color:var(--gold); background:rgba(226,192,122,.1);
  border:1px solid var(--line); border-radius:999px; padding:3px 11px;
  text-transform:uppercase;
}
.card-title{ font-size:1.12rem; line-height:1.4; }
.card-desc{
  color:var(--muted); font-size:14px; line-height:1.6;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.card-meta{
  display:flex; flex-wrap:wrap; gap:12px; margin-top:auto; padding-top:10px;
  border-top:1px solid var(--line-soft); color:var(--muted); font-size:12.5px; align-items:center;
}
.card-meta span{ display:inline-flex; align-items:center; gap:4px; }

.featured{
  display:grid; grid-template-columns:1.05fr 1fr;
  background:var(--card); border:1px solid var(--line);
  border-radius:24px; overflow:hidden; margin-top:8px;
  box-shadow:var(--shadow);
}
.featured-cover{ min-height:340px; background:#0c1320; position:relative; }
.featured-cover img{ width:100%; height:100%; object-fit:cover; display:block; position:absolute; inset:0; }
.featured-body{ padding:clamp(24px,3.4vw,42px); display:flex; flex-direction:column; gap:16px; justify-content:center; }
.featured-body h2{ font-size:clamp(1.5rem,3vw,2.15rem); }
.featured-body p{ color:var(--muted); font-size:15px; line-height:1.75; }
.featured-meta{ display:flex; flex-wrap:wrap; gap:16px; color:var(--muted); font-size:13px; align-items:center; }
.featured-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }

/* ============================================================
   EMPTY / NOTICE
   ============================================================ */
.empty{
  grid-column:1 / -1; text-align:center; padding:56px 22px;
  border:1px dashed var(--line-soft); border-radius:var(--radius);
  color:var(--muted); background:rgba(255,255,255,.015);
}
.empty h3{ color:var(--text); margin-bottom:8px; font-size:1.15rem; }
.empty p{ font-size:14.5px; }

.notice{
  background:rgba(226,192,122,.07); border:1px solid var(--line);
  border-radius:14px; padding:14px 18px;
  font-size:14px; color:#d7cfc0; line-height:1.7; margin-bottom:22px;
}
.notice strong{ color:var(--gold); }
.notice.info{ background:rgba(110,160,235,.07); border-color:rgba(110,160,235,.25); }
.notice.info strong{ color:var(--info); }
.notice.success{ background:rgba(111,211,154,.07); border-color:rgba(111,211,154,.25); }
.notice.success strong{ color:var(--ok); }

/* ============================================================
   READER
   ============================================================ */
.story-hero{
  display:grid; grid-template-columns:270px 1fr; gap:28px;
  background:var(--card); border:1px solid var(--line-soft);
  border-radius:22px; padding:22px; margin:28px 0;
}
.story-hero-cover{
  border-radius:16px; overflow:hidden; aspect-ratio:3/4;
  background:#0c1320; box-shadow:var(--shadow);
}
.story-hero-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
.story-hero-info{ display:flex; flex-direction:column; gap:14px; }
.story-hero-info h1{ font-size:clamp(1.6rem,3.4vw,2.4rem); line-height:1.28; }
.story-desc{ color:var(--muted); font-size:15px; line-height:1.75; }
.story-meta{ display:flex; flex-wrap:wrap; gap:16px; color:var(--muted); font-size:13.5px; align-items:center; }
.story-meta span{ display:inline-flex; align-items:center; gap:5px; }
.story-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
.read-progress{
  height:4px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; margin-top:8px;
}
.read-progress > i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,#c9a05a,#ecd39a); transition:width .4s ease;
}
.progress-label{ font-size:12.5px; color:var(--muted); margin-top:6px; }

.reader-shell{
  display:grid; grid-template-columns:290px minmax(0,1fr);
  gap:32px; align-items:start; padding-bottom:80px;
}
.toc{
  position:sticky; top:86px;
  background:var(--card); border:1px solid var(--line-soft);
  border-radius:16px; padding:16px; max-height:calc(100vh - 120px); overflow-y:auto;
}
.toc-toggle{
  width:100%; display:none; align-items:center; justify-content:space-between;
  background:transparent; border:0; color:var(--text); font-size:15px;
  font-weight:600; cursor:pointer; padding:4px 2px; font-family:var(--serif);
}
.toc-chapter{ margin-bottom:14px; }
.toc-ch{ font-size:13px; font-weight:700; color:var(--gold); margin:0 0 6px; }
.toc-sub{
  display:block; font-size:14px; color:var(--muted); text-decoration:none;
  padding:6px 10px; border-radius:9px; border-inline-start:2px solid transparent;
  transition:all .18s; line-height:1.5;
}
.toc-sub:hover{ color:var(--text); background:rgba(255,255,255,.04); }
.toc-sub.active{
  color:var(--gold); background:rgba(226,192,122,.1);
  border-inline-start-color:var(--gold); font-weight:600;
}
.reader-tools{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--line-soft);
  border-radius:14px; padding:10px 14px; margin-bottom:16px;
  font-size:13.5px; color:var(--muted);
}
.reader-tools .sep{ width:1px; height:20px; background:var(--line-soft); }
.reader-tools .tool-btn{
  background:rgba(255,255,255,.04); border:1px solid var(--line-soft);
  color:var(--text); min-width:38px; height:32px; border-radius:9px;
  cursor:pointer; font-size:14px; display:inline-flex; padding:0 9px;
  align-items:center; justify-content:center; transition:all .18s;
}
.reader-tools .tool-btn:hover{ border-color:var(--gold); color:var(--gold); }
.theme-dot{
  width:26px; height:26px; border-radius:50%; cursor:pointer;
  border:2px solid transparent; transition:all .18s; padding:0;
}
.theme-dot[data-theme="light"]{ background:#f9f5ec; }
.theme-dot[data-theme="sepia"]{ background:#f2e6cf; }
.theme-dot[data-theme="dark"]{ background:#131a27; border-color:rgba(255,255,255,.2); }
.theme-dot.active{ border-color:var(--gold); transform:scale(1.1); }

.reader-paper{
  --paper:#f9f5ec; --paper-text:#241f18; --paper-muted:#6d6455; --paper-line:rgba(0,0,0,.1);
  background:var(--paper); color:var(--paper-text);
  border-radius:20px; padding:clamp(22px,4vw,52px);
  box-shadow:0 30px 60px -34px rgba(0,0,0,.95);
  transition:background .3s, color .3s;
}
.reader-paper[data-theme="light"]{ --paper:#f9f5ec; --paper-text:#241f18; --paper-muted:#6d6455; --paper-line:rgba(0,0,0,.1); }
.reader-paper[data-theme="sepia"]{ --paper:#f2e6cf; --paper-text:#3b2e1e; --paper-muted:#7d6b52; --paper-line:rgba(0,0,0,.12); }
.reader-paper[data-theme="dark"]{ --paper:#131a27; --paper-text:#dcd8cf; --paper-muted:#8e97ab; --paper-line:rgba(255,255,255,.1); }

.reader-chapter-label{
  font-family:var(--sans); font-size:12.5px; letter-spacing:1.6px;
  text-transform:uppercase; color:var(--paper-muted); margin-bottom:10px; font-weight:600;
}
.reader-sub-title{
  font-size:clamp(1.35rem,3vw,1.85rem); margin-bottom:26px;
  padding-bottom:18px; border-bottom:1px solid var(--paper-line);
  color:var(--paper-text);
}
.reader-body{
  font-family:var(--serif); font-size:var(--reader-size, 19px);
  line-height:2.05; letter-spacing:.2px; color:var(--paper-text);
}
.reader-body p{ margin:0 0 1.35em; }
.reader-body p:last-child{ margin-bottom:0; }
.reader-figure{ margin:2.1em 0; }
.reader-figure img{ width:100%; border-radius:14px; display:block; }
.reader-figure figcaption{
  font-family:var(--sans); font-size:13.5px; color:var(--paper-muted);
  text-align:center; margin-top:11px; line-height:1.6;
}
.img-missing{
  display:flex; align-items:center; justify-content:center;
  min-height:140px; border:1px dashed var(--paper-line); border-radius:14px;
  color:var(--paper-muted); font-family:var(--sans); font-size:14px;
}
.reader-nav{
  display:flex; justify-content:space-between; gap:12px;
  margin-top:38px; padding-top:24px; border-top:1px solid var(--paper-line); flex-wrap:wrap;
}
.reader-nav .btn{
  background:transparent; border-color:var(--paper-line); color:var(--paper-text);
}
.reader-nav .btn:hover{ background:rgba(0,0,0,.06); border-color:var(--gold); color:var(--gold); }
.reader-nav .btn[disabled]{ opacity:.35; pointer-events:none; }

/* ============================================================
   ADMIN — SHELL
   ============================================================ */
.admin{ padding-top:28px; padding-bottom:80px; }
.admin-head{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:18px; flex-wrap:wrap; margin-bottom:22px;
}
.admin-head h1{ font-size:clamp(1.5rem,3.4vw,2.1rem); }
.admin-head .sub{ color:var(--muted); font-size:14.5px; margin-top:6px; }
.admin-actions{ display:flex; gap:9px; flex-wrap:wrap; }

.admin-tabs{
  display:flex; gap:4px; flex-wrap:wrap;
  border-bottom:1px solid var(--line-soft); margin-bottom:24px;
  position:sticky; top:66px; z-index:20;
  background:rgba(10,15,24,.92); backdrop-filter:blur(10px);
  padding:8px 0;
}
.admin-tab{
  padding:9px 16px; cursor:pointer; font-family:var(--sans);
  font-size:14px; font-weight:600; color:var(--muted);
  background:transparent; border:1px solid transparent;
  border-radius:11px; margin-bottom:-1px; transition:all .2s;
  display:inline-flex; align-items:center; gap:6px;
}
.admin-tab:hover{ color:var(--text); background:rgba(255,255,255,.03); }
.admin-tab.active{
  color:var(--gold); background:var(--card); border-color:var(--line);
}
.admin-tab .badge{
  background:rgba(226,192,122,.2); color:var(--gold);
  font-size:11px; padding:1px 7px; border-radius:999px; font-weight:700;
}

.panel{
  background:var(--card); border:1px solid var(--line-soft);
  border-radius:var(--radius); padding:22px; margin-bottom:22px;
}
.panel-title{
  font-size:1.12rem; color:var(--gold); margin:0 0 18px;
  padding-bottom:12px; border-bottom:1px solid var(--line-soft);
}

.field{ display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
.field-label{ font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.2px; }

input[type="text"], input[type="search"], input[type="number"], textarea, select{
  font-family:var(--sans); background:#0d1524; color:var(--text);
  border:1px solid var(--line-soft); border-radius:12px;
  padding:11px 14px; font-size:15px; outline:none; width:100%;
  transition:border-color .2s, box-shadow .2s; line-height:1.6;
}
input:focus, textarea:focus, select:focus{
  border-color:var(--gold); box-shadow:0 0 0 3px rgba(226,192,122,.1);
}
textarea{ resize:vertical; min-height:70px; }
select{ cursor:pointer; }

.checkbox{
  display:flex; align-items:center; gap:10px; font-size:14.5px;
  color:var(--muted); cursor:pointer; user-select:none; margin-bottom:16px;
}
.checkbox input{ width:18px; height:18px; accent-color:var(--gold); cursor:pointer; }

.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
.form-grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 18px; }

/* ============================================================
   ADMIN — DASHBOARD
   ============================================================ */
.stats-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
  gap:14px; margin-bottom:22px;
}
.stat-card{
  background:var(--card); border:1px solid var(--line-soft);
  border-radius:16px; padding:18px 20px;
  display:flex; flex-direction:column; gap:6px;
  transition:border-color .2s, transform .2s;
}
.stat-card:hover{ border-color:var(--line); transform:translateY(-2px); }
.stat-label{ font-size:12.5px; color:var(--muted); font-weight:600;
  letter-spacing:.4px; text-transform:uppercase; }
.stat-value{ font-family:var(--serif); font-size:2rem; font-weight:700;
  color:var(--gold); line-height:1.1; }
.stat-sub{ font-size:12.5px; color:var(--muted); }

.dash-two-col{
  display:grid; grid-template-columns:1fr 1fr; gap:22px;
}

.recent-list{ display:flex; flex-direction:column; gap:10px; }
.recent-item{
  display:flex; align-items:center; gap:12px;
  padding:10px 12px; border-radius:12px;
  background:rgba(255,255,255,.02);
  border:1px solid transparent;
  transition:border-color .2s;
}
.recent-item:hover{ border-color:var(--line-soft); }
.recent-thumb{
  width:44px; height:44px; border-radius:8px; overflow:hidden;
  background:#0c1320; flex-shrink:0;
}
.recent-thumb img{ width:100%; height:100%; object-fit:cover; }
.recent-info{ flex:1; min-width:0; }
.recent-title{ font-size:14px; font-weight:600; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.recent-meta{ font-size:12px; color:var(--muted); }

.quick-actions{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px;
}
.quick-action{
  background:var(--card); border:1px solid var(--line-soft);
  border-radius:12px; padding:14px; cursor:pointer;
  text-align:center; color:var(--muted); font-size:13px; font-weight:600;
  transition:all .2s; display:flex; flex-direction:column; align-items:center; gap:8px;
}
.quick-action:hover{ color:var(--gold); border-color:var(--gold);
  background:rgba(226,192,122,.06); transform:translateY(-2px); }
.quick-action .qa-icon{ font-size:24px; line-height:1; }

/* ============================================================
   ADMIN — STORY LIST
   ============================================================ */
.admin-toolbar{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  background:var(--card); border:1px solid var(--line-soft);
  border-radius:14px; padding:12px 14px; margin-bottom:16px;
}
.admin-toolbar input[type="search"]{
  flex:1; min-width:170px; padding:9px 14px; border-radius:10px;
}
.admin-toolbar select{ padding:9px 14px; border-radius:10px; width:auto; min-width:130px; }
.admin-toolbar .count{ color:var(--muted); font-size:13px; white-space:nowrap; }

.admin-list{ display:flex; flex-direction:column; gap:10px; }
.admin-item{
  display:grid; grid-template-columns:60px 1fr auto; gap:14px; align-items:center;
  background:var(--card); border:1px solid var(--line-soft);
  border-radius:14px; padding:12px 16px;
  transition:border-color .2s;
}
.admin-item:hover{ border-color:var(--line); }
.admin-thumb{
  width:60px; height:60px; border-radius:9px; overflow:hidden; background:#0c1320;
}
.admin-thumb img{ width:100%; height:100%; object-fit:cover; }
.admin-item h3{ font-size:1rem; margin-bottom:3px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.admin-item .meta{
  color:var(--muted); font-size:12.5px; display:flex; gap:12px; flex-wrap:wrap;
}
.admin-item .actions{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }

.status-badge{
  font-size:11px; padding:2px 9px; border-radius:999px; font-weight:700;
  border:1px solid transparent; letter-spacing:.3px;
}
.status-badge.published{ color:var(--ok); background:rgba(111,211,154,.1); border-color:rgba(111,211,154,.3); }
.status-badge.draft{ color:#e0b877; background:rgba(224,184,119,.1); border-color:rgba(224,184,119,.3); }
.status-badge.featured{ color:var(--gold); background:rgba(226,192,122,.1); border-color:var(--line); }

/* ============================================================
   ADMIN — MEDIA LIBRARY
   ============================================================ */
.media-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:14px;
}
.media-card{
  background:var(--card); border:1px solid var(--line-soft);
  border-radius:14px; overflow:hidden;
  display:flex; flex-direction:column;
  transition:border-color .2s, transform .2s;
}
.media-card:hover{ border-color:var(--line); transform:translateY(-2px); }
.media-thumb{
  aspect-ratio:1; overflow:hidden; background:#0c1320;
  display:flex; align-items:center; justify-content:center;
}
.media-thumb img{ width:100%; height:100%; object-fit:cover; }
.media-info{ padding:10px 12px; display:flex; flex-direction:column; gap:3px; }
.media-name{
  font-size:12.5px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; color:var(--text);
}
.media-meta{ font-size:11px; color:var(--muted); display:flex; justify-content:space-between; }
.media-actions{
  display:flex; gap:4px; padding:0 10px 10px;
}
.media-usage{
  font-size:11px; color:var(--gold); padding:0 12px 10px;
  display:flex; align-items:center; gap:4px;
}

/* ============================================================
   ADMIN — EDITOR
   ============================================================ */
.cover-uploader{
  display:grid; grid-template-columns:130px 1fr; gap:16px; align-items:center;
  background:#0d1524; border:1px solid var(--line-soft);
  border-radius:14px; padding:14px;
}
.cover-preview{
  aspect-ratio:3/4; border-radius:10px; overflow:hidden; background:#0a1120;
  display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:12.5px; text-align:center; padding:8px;
  position:relative;
}
.cover-preview img{ width:100%; height:100%; object-fit:cover; }
.cover-preview.dragover{
  outline:2px dashed var(--gold); outline-offset:2px;
  background:rgba(226,192,122,.1);
}
.cover-uploader .row-actions{ display:flex; gap:9px; flex-wrap:wrap; }

.chapter-block{
  background:#0f1828; border:1px solid var(--line-soft);
  border-radius:14px; padding:16px; margin-bottom:16px;
}
.sub-block{
  background:#0b1322; border:1px solid var(--line-soft);
  border-radius:12px; padding:14px; margin-top:12px;
}
.row-head{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px;
}
.row-head input[type="text"]{ flex:1; min-width:170px; }
.row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
.icon-btn{
  width:32px; height:32px; border-radius:9px; cursor:pointer;
  background:rgba(255,255,255,.05); border:1px solid var(--line-soft);
  color:var(--muted); font-size:14px; display:inline-flex;
  align-items:center; justify-content:center; transition:all .18s; padding:0;
}
.icon-btn:hover{ color:var(--gold); border-color:var(--gold); }
.icon-btn.danger:hover{ color:var(--danger); border-color:rgba(226,109,109,.6); }

.block{
  background:#0a1020; border:1px dashed rgba(255,255,255,.09);
  border-radius:10px; padding:11px; margin-bottom:11px;
}
.block textarea{ min-height:80px; font-family:var(--serif); font-size:15.5px; line-height:1.9; }
.block-img img{
  width:100%; max-height:260px; object-fit:cover;
  border-radius:9px; display:block; margin-bottom:11px;
}
.block-tools{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
.block-type{
  font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
  color:var(--gold-dim); font-weight:700;
}
.sub-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }

.word-count{
  font-size:12px; color:var(--muted); margin-left:auto; font-family:var(--sans);
}
.word-count b{ color:var(--gold); }

.save-bar{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  margin:6px 0 44px;
}

/* ============================================================
   ADMIN — CATEGORIES
   ============================================================ */
.cat-row{
  display:flex; gap:9px; align-items:center; flex-wrap:wrap;
  background:#0d1524; border:1px solid var(--line-soft);
  border-radius:12px; padding:10px 12px;
}
.cat-row input[type="text"]{ flex:1; min-width:150px; }
.cat-count{
  font-size:13px; color:var(--muted); white-space:nowrap;
  background:rgba(255,255,255,.04); padding:4px 10px; border-radius:8px;
}

/* ============================================================
   PREVIEW OVERLAY
   ============================================================ */
.overlay{
  position:fixed; inset:0; z-index:150; background:var(--bg);
  overflow-y:auto; animation:fade .25s ease;
}
@keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
.overlay-bar{
  position:sticky; top:0; z-index:2;
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:13px 20px; background:rgba(10,15,24,.94);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line-soft);
}
.overlay-bar strong{ font-family:var(--serif); color:var(--gold); font-size:16px; }
.overlay-body{ max-width:900px; margin:0 auto; padding:26px 20px 70px; }

/* ============================================================
   TOAST
   ============================================================ */
#toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%, 24px);
  background:#1b2436; color:var(--text);
  border:1px solid var(--line); border-radius:14px;
  padding:12px 22px; font-size:14.5px; z-index:300;
  box-shadow:var(--shadow); opacity:0; pointer-events:none;
  transition:opacity .28s, transform .28s; max-width:min(92vw, 520px);
  text-align:center; line-height:1.55;
}
#toast.show{ opacity:1; transform:translate(-50%, 0); }

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer{ border-top:1px solid var(--line-soft); background:var(--bg-2); margin-top:40px; }
.footer-grid{
  display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:36px;
  padding:52px 20px 34px;
}
.footer-grid h4{
  color:var(--gold); margin-bottom:12px; letter-spacing:.6px;
  font-family:var(--sans); font-weight:700; text-transform:uppercase; font-size:12.5px;
}
.footer-text{ color:var(--muted); font-size:14px; line-height:1.8; }
.footer-grid p{ color:var(--muted); font-size:14px; line-height:1.8; }
.footer-grid .brand{ display:inline-block; margin-bottom:12px; font-size:20px; }
.footer-bottom{
  border-top:1px solid var(--line-soft);
  padding:18px 20px 26px; text-align:center;
  color:var(--muted); font-size:13px; line-height:1.8;
  max-width:1220px; margin:0 auto;
}
.footer-bottom .tiny{ font-size:12px; opacity:.75; margin-top:6px; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 980px){
  .reader-shell{ grid-template-columns:1fr; }
  .toc{ position:static; max-height:none; }
  .toc-toggle{ display:flex; }
  .toc-body{ display:none; margin-top:12px; }
  .toc.open .toc-body{ display:block; }
  .featured{ grid-template-columns:1fr; }
  .featured-cover{ min-height:240px; position:relative; }
  .dash-two-col{ grid-template-columns:1fr; }
}
@media (max-width: 900px){
  .nav{
    position:absolute; top:100%; left:0; right:0;
    flex-direction:column; gap:2px;
    background:var(--bg-2); border-bottom:1px solid var(--line-soft);
    padding:12px; display:none; box-shadow:var(--shadow);
  }
  .nav.open{ display:flex; }
  .nav a{ padding:11px 14px; font-size:15.5px; }
  .menu-toggle{ display:inline-flex; }
  .header-actions .btn{ display:none; }
  .header-actions .menu-toggle{ display:inline-flex; }
  .admin-tabs{ top:60px; }
}
@media (max-width: 760px){
  body{ font-size:16px; }
  .hero{ padding:60px 0 48px; }
  .story-hero{ grid-template-columns:1fr; padding:16px; }
  .story-hero-cover{ max-height:300px; aspect-ratio:16/10; }
  .footer-grid{ grid-template-columns:1fr; gap:26px; padding:38px 20px 26px; }
  .admin-item{ grid-template-columns:54px 1fr; }
  .admin-item .actions{ grid-column:1 / -1; justify-content:flex-start; }
  .cover-uploader{ grid-template-columns:1fr; }
  .cover-preview{ aspect-ratio:16/9; max-height:180px; }
  .section{ padding:38px 0; }
  .grid{ grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:18px; }
  .form-grid, .form-grid-3{ grid-template-columns:1fr; }
  .media-grid{ grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); }
  .admin-tabs{ top:56px; overflow-x:auto; flex-wrap:nowrap; padding:6px 0; }
  .admin-tab{ flex-shrink:0; }
}
@media (max-width: 460px){
  .grid{ grid-template-columns:1fr; }
  .searchbar{ flex-direction:column; border-radius:18px; padding:10px; }
  .searchbar input[type="search"]{ padding:8px 10px; width:100%; }
  .searchbar .btn{ width:100%; }
  .stats-grid{ grid-template-columns:1fr 1fr; }
  .stat-value{ font-size:1.5rem; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  html{ scroll-behavior:auto; }
}

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));

function fmtDate(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleDateString('hi-IN', { day:'numeric', month:'long', year:'numeric' }); }
  catch(e){ return ''; }
}
function fmtBytes(b){
  if(!b) return '0 B';
  const u = ['B','KB','MB','GB'];
  let i = 0; let n = b;
  while(n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  return n.toFixed(n < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
}
function setPath(obj, path, value){
  const keys = String(path).split('.');
  let cur = obj;
  for(let i = 0; i < keys.length - 1; i++){
    if(cur == null) return;
    if(!(keys[i] in cur)) cur[keys[i]] = {};
    cur = cur[keys[i]];
  }
  if(cur == null) return;
  cur[keys[keys.length - 1]] = value;
}
function moveItem(arr, from, to){
  if(to < 0 || to >= arr.length || from < 0 || from >= arr.length) return;
  const [item] = arr.splice(from, 1);
  arr.splice(to, 0, item);
}
function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
function deepMerge(base, extra){
  if(!extra || typeof extra !== 'object' || Array.isArray(extra)) return base;
  const out = Object.assign({}, base);
  Object.keys(extra).forEach(k => {
    const bv = out[k], ev = extra[k];
    if(ev && typeof ev === 'object' && !Array.isArray(ev) &&
       bv && typeof bv === 'object' && !Array.isArray(bv)){
      out[k] = deepMerge(bv, ev);
    }else if(ev !== undefined){
      out[k] = ev;
    }
  });

}

/* ---------------- IndexedDB ---------------- */

function openDB(){
  return new Promise((resolve, reject) => {
    if(!('indexedDB' in window)) return reject(new Error('unavailable'));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains(DB_STORE)){
        d.createObjectStore(DB_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(record){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(record);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
function dbGet(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const r = tx.objectStore(DB_STORE).get(id);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function dbAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const r = tx.objectStore(DB_STORE).getAll();
    r.onsuccess = () => resolve(r.result || []);
    r.onerror = () => reject(r.error);
  });
}
function dbDelete(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
function dbClear(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).clear();
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function saveImageBlob(blob, name, forcedId){
  if(!db) throw new Error('IndexedDB unavailable');
  const id = forcedId || uid('img');
  const record = { id, blob, name: name || 'image', type: blob.type, size: blob.size,
                   uploadedAt: new Date().toISOString() };
  await dbPut(record);
  const old = imageURLs.get(id);
  if(old) URL.revokeObjectURL(old);
  imageURLs.set(id, URL.createObjectURL(blob));
  return id;
}
async function loadImages(){
  if(!db) return;
  try{
    const records = await dbAll();
    imageURLs.forEach(u => URL.revokeObjectURL(u));
    imageURLs.clear();
    records.forEach(rec => {
      if(rec && rec.blob) imageURLs.set(rec.id, URL.createObjectURL(rec.blob));
    });
  }catch(e){ console.error('Image load failed', e); }
}

function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
async function dataURLToBlob(dataUrl){
  const res = await fetch(dataUrl);
  return await res.blob();
}

function countSubchapters(story){
  return (story.chapters || []).reduce((sum, ch) => sum + (ch.subchapters || []).length, 0);
}
function flattenStory(story){
  const out = [];
  (story.chapters || []).forEach((ch, ci) => {
    (ch.subchapters || []).forEach((sb, si) => out.push({ ch, sb, ci, si }));
  });
  return out;
}
function publishedStories(){ return state.stories.filter(s => s.status === 'published'); }
function filterStories(list){
  let out = list.slice();
  const q = state.search.trim().toLowerCase();
  if(q){
    out = out.filter(s =>
      String(s.title || '').toLowerCase().includes(q) ||
      String(s.author || '').toLowerCase().includes(q));
  }
  if(state.category && state.category !== 'सभी'){
    out = out.filter(s => s.category === state.category);
  }
  return out;
}
function sortStories(list, sort){
  const arr = list.slice();
  if(sort === 'views')      arr.sort((a, b) => (b.views || 0) - (a.views || 0));
  else if(sort === 'likes') arr.sort((a, b) => (b.likes || 0) - (a.likes || 0));
  else                      arr.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  return arr;
}
function featuredStory(){
  const pub = publishedStories();
  const id = state.settings.sections.featuredStoryId;
  if(id){
    const found = pub.find(s => s.id === id);
    if(found) return found;
  }
  return pub[0] || null;
}
function imageUsageCount(imageId){
  let n = 0;
  state.stories.forEach(story => {
    if(story.coverImageId === imageId) n++;
    (story.chapters || []).forEach(ch => (ch.subchapters || []).forEach(sb => {
      (sb.blocks || []).forEach(b => { if(b.type === 'img' && b.imageId === imageId) n++; });
    }));
  });
  return n;
}

function applySettingsToChrome(){
  const st = state.settings;
  const brandHTML = `${escapeHTML(st.brandMain)} <span>${escapeHTML(st.brandAccent)}</span>`;
  const bl = $('#brandLink'); if(bl) bl.innerHTML = brandHTML;

   ============================================================================ */

const app = $('#app');

function parseRoute(){
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  return { name: parts[0] || 'home', parts };
}
function setActiveNav(name){
  const map = { home:'home', stories:'stories', popular:'popular', 'new':'new', favorites:'favorites' };
  const key = map[name] || '';
  $$('#mainNav a').forEach(a => {
    a.classList.toggle('active', a.dataset.nav === key);
    if(a.dataset.nav === key) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
}
function closeMobileNav(){
  const nav = $('#mainNav');
  if(nav) nav.classList.remove('open');
  const btn = $('[data-action="toggle-menu"]');
  if(btn) btn.setAttribute('aria-expanded', 'false');
}
function render(){
  const route = parseRoute();
  closeMobileNav();
  applySettingsToChrome();
  switch(route.name){
    case 'story':     renderStory(route.parts[1], route.parts[2], route.parts[3]); break;
    case 'admin':     renderAdmin(); break;
    case 'stories':   renderListingPage('stories'); break;
    case 'popular':   renderListingPage('popular'); break;
    case 'new':       renderListingPage('new'); break;
    case 'favorites': renderFavorites(); break;
    default:          renderHome(); break;
  }
  setActiveNav(route.name);
  try{ window.scrollTo({ top:0, behavior:'auto' }); }catch(e){ window.scrollTo(0, 0); }
}

  const published = publishedStories();
  const searching = state.search.trim() !== '';
  const filtering = state.category !== 'सभी';
  let html = '';

  if(searching || filtering){
    const list = sortStories(filterStories(published), state.sort);
    html = `
    <section class="section container">
      <div class="section-head">
        <div>
          <h2>${searching ? 'खोज परिणाम' : escapeHTML(state.category) + ' की कहानियाँ'}</h2>
          <p class="sub">${fmtNum(list.length)} कहानियाँ मिलीं</p>

      <div class="chips">${chipsHTML()}</div>
      ${list.length ? `<div class="grid">${list.map(storyCard).join('')}</div>`
        : emptyState('कोई कहानी नहीं मिली', 'कृपया दूसरा नाम या दूसरी श्रेणी चुनकर देखें।')}
    </section>`;
  } else {
    const feat = featuredStory();
    const latest = sortStories(published, 'newest').slice(0, Number(sec.latestCount) || 6);
    const popular = sortStories(published, 'views').slice(0, Number(sec.popularCount) || 3);

    if(sec.showFeatured && feat) html += featuredHTML(feat);
    if(sec.showLatest){
      html += `<section class="section container">
        <div class="section-head">
          <div><h2>${escapeHTML(sec.latestTitle)}</h2><p class="sub">${escapeHTML(sec.latestSub)}</p></div>
          <a class="btn" href="#/new">सभी देखें →</a>
        </div>
        ${latest.length ? `<div class="grid">${latest.map(storyCard).join('')}</div>`
          : emptyState('अभी कोई कहानी प्रकाशित नहीं है', 'लेखक पैनल से अपनी पहली कहानी प्रकाशित करें।')}
      </section>`;
    }
    if(sec.showCategories){
      html += `<section class="section container">
        <div class="section-head">
          <div><h2>${escapeHTML(sec.categoriesTitle)}</h2><p class="sub">${escapeHTML(sec.categoriesSub)}</p></div>
        </div>
        <div class="chips">${chipsHTML()}</div>
      </section>`;
    }
    if(sec.showPopular){
      html += `<section class="section container">
        <div class="section-head">
          <div><h2>${escapeHTML(sec.popularTitle)}</h2><p class="sub">${escapeHTML(sec.popularSub)}</p></div>
          <a class="btn" href="#/popular">सभी देखें →</a>
        </div>
        ${popular.length ? `<div class="grid">${popular.map(storyCard).join('')}</div>`

      </section>`;
    }
    if(!html) html = `<div class="container section">${emptyState('होमपेज अभी खाली है', 'लेखक पैनल → साइट सेटिंग्स से होमपेज सेक्शन चालू करें।')}</div>`;

/* ============================================================================
   14. STORY READER
   ============================================================================ */

function renderStory(storyId, cStr, sStr){
  const story = state.stories.find(s => s.id === storyId);
  if(!story){
    app.innerHTML = `<div class="container section">${emptyState('कहानी नहीं मिली', 'हो सकता है यह कहानी हटा दी गई हो।')}
      <p style="text-align:center;margin-top:18px"><a class="btn" href="#/stories">सभी कहानियाँ देखें</a></p></div>`;
    return;
  }
  const flat = flattenStory(story);
  if(!flat.length){
    app.innerHTML = `<div class="container section">${emptyState('इस कहानी में अभी कोई अध्याय नहीं है', 'लेखक पैनल से अध्याय जोड़ें।')}</div>`;
    return;
  }
  let ci = parseInt(cStr, 10), si = parseInt(sStr, 10);
  const valid = !isNaN(ci) && !isNaN(si) && story.chapters[ci] && story.chapters[ci].subchapters[si];
  if(!valid){
    const p = state.progress[story.id];
    if(p && story.chapters[p.ci] && story.chapters[p.ci].subchapters[p.si]){ ci = p.ci; si = p.si; }
    else { ci = 0; si = 0; }
  }

  const viewKey = 'ks.viewed.' + story.id;
  try{
    if(!sessionStorage.getItem(viewKey)){
      story.views = (story.views || 0) + 1;
      sessionStorage.setItem(viewKey, '1');
      saveStories();
    }
  }catch(e){}

  state.progress[story.id] = { ci, si };
  saveUser();

  const chapter = story.chapters[ci];
  const sub = chapter.subchapters[si];
  const flatIndex = flat.findIndex(f => f.ci === ci && f.si === si);
  const percent = Math.round(((flatIndex + 1) / flat.length) * 100);
  const prev = flatIndex > 0 ? flat[flatIndex - 1] : null;
  const next = flatIndex < flat.length - 1 ? flat[flatIndex + 1] : null;
  const liked = state.likes.has(story.id);
  const bookmarked = state.bookmarks.has(story.id);

  app.innerHTML = `
  <div class="container">
    <header class="story-hero">
      <div class="story-hero-cover">
        <img src="${coverURL(story)}" alt="${escapeAttr(story.title)} का आवरण चित्र" />
      </div>
      <div class="story-hero-info">
        <span class="pill">${escapeHTML(story.category || 'कहानी')}</span>
        <h1>${escapeHTML(story.title)}</h1>
        <p class="story-desc">${escapeHTML(story.description || '')}</p>
        <div class="story-meta">
          <span>${ICON.pen} ${escapeHTML(story.author || 'अज्ञात')}</span>
          <span>${fmtDate(story.createdAt)}</span>
          <span>${ICON.eye} <span id="viewCount">${fmtNum(story.views)}</span> बार पढ़ी गई</span>
          <span>${ICON.heart} <span data-like-count="${story.id}">${fmtNum(story.likes)}</span> पसंद</span>
          <span>${ICON.book} ${fmtNum(flat.length)} उप-अध्याय</span>
        </div>
        <div class="story-actions">
          <button class="btn ${liked ? 'active' : ''}" data-action="like" data-id="${story.id}"
                  aria-pressed="${liked}">${ICON.heart} <span>${liked ? 'पसंद किया गया' : 'पसंद करें'}</span></button>
          <button class="btn ${bookmarked ? 'active' : ''}" data-action="bookmark" data-id="${story.id}"
                  aria-pressed="${bookmarked}">${bookmarked ? 'बुकमार्क हटाएँ' : 'बुकमार्क करें'}</button>
          <button class="btn" data-action="share" data-id="${story.id}">साझा करें</button>
        </div>
        <div>
          <div class="read-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
               aria-valuenow="${percent}" aria-label="पढ़ने की प्रगति">
            <i style="width:${percent}%"></i>
          </div>
          <p class="progress-label">पढ़ने की प्रगति — ${percent}% (${fmtNum(flatIndex + 1)}/${fmtNum(flat.length)} उप-अध्याय)</p>
        </div>
      </div>
    </header>

    <div class="reader-shell">
      <aside class="toc" id="toc">
        <button class="toc-toggle" data-action="toggle-toc" aria-expanded="false" aria-controls="tocBody">
          <span>विषय-सूची</span><span aria-hidden="true">▾</span>
        </button>
        <div class="toc-body" id="tocBody">
          ${story.chapters.map((ch, chi) => `
            <div class="toc-chapter">
              <p class="toc-ch">अध्याय ${chi + 1} — ${escapeHTML(ch.title)}</p>
              ${(ch.subchapters || []).map((sc, sci) => `
                <a class="toc-sub ${chi === ci && sci === si ? 'active' : ''}"
                   href="#/story/${story.id}/${chi}/${sci}"
                   ${chi === ci && sci === si ? 'aria-current="true"' : ''}>
                  ${chi + 1}.${sci + 1} ${escapeHTML(sc.title)}
                </a>`).join('')}
            </div>`).join('')}
        </div>
      </aside>
      <div class="reader-main">
        <div class="reader-tools" role="group" aria-label="पढ़ने की सेटिंग">
          <span>पाठ आकार</span>
          <button class="tool-btn" data-action="font-smaller" aria-label="पाठ छोटा करें">अ−</button>
          <button class="tool-btn" data-action="font-larger" aria-label="पाठ बड़ा करें">अ+</button>
          <span class="sep" aria-hidden="true"></span>
          <span>पृष्ठभूमि</span>
          <button class="theme-dot ${state.prefs.theme === 'light' ? 'active' : ''}" data-action="set-theme" data-theme="light" aria-label="हल्की पृष्ठभूमि"></button>
          <button class="theme-dot ${state.prefs.theme === 'sepia' ? 'active' : ''}" data-action="set-theme" data-theme="sepia" aria-label="सेपिया पृष्ठभूमि"></button>
          <button class="theme-dot ${state.prefs.theme === 'dark' ? 'active' : ''}" data-action="set-theme" data-theme="dark" aria-label="गहरी पृष्ठभूमि"></button>
        </div>
        <article class="reader-paper" data-theme="${state.prefs.theme}" style="--reader-size:${state.prefs.fontSize}px">
          <p class="reader-chapter-label">अध्याय ${ci + 1} — ${escapeHTML(chapter.title)}</p>
          <h2 class="reader-sub-title">${escapeHTML(sub.title)}</h2>
          <div class="reader-body">${blocksHTML(sub.blocks || [])}</div>
          <nav class="reader-nav" aria-label="अध्याय नेविगेशन">
            ${prev ? `<a class="btn" href="#/story/${story.id}/${prev.ci}/${prev.si}">← ${escapeHTML(prev.sb.title)}</a>`
                    : `<button class="btn" disabled>← पिछला</button>`}
            ${next ? `<a class="btn" href="#/story/${story.id}/${next.ci}/${next.si}">${escapeHTML(next.sb.title)} →</a>`
                    : `<button class="btn" disabled>अगला →</button>`}
          </nav>
        </article>
      </div>
    </div>
  </div>`;
}

function blocksHTML(blocks){
  if(!Array.isArray(blocks) || !blocks.length){
    return `<p style="opacity:.6">— इस उप-अध्याय में अभी कोई सामग्री नहीं है —</p>`;
  }
  return blocks.map(block => {
    if(block.type === 'img'){
      const src = block.imageId ? imageURLs.get(block.imageId) : null;
      const caption = block.caption ? `<figcaption>${escapeHTML(block.caption)}</figcaption>` : '';
      if(!src) return `<figure class="reader-figure"><div class="img-missing">चित्र उपलब्ध नहीं है</div>${caption}</figure>`;
      return `<figure class="reader-figure">
        <img src="${src}" alt="${escapeAttr(block.alt || block.caption || 'कहानी का चित्र')}" loading="lazy" />
        ${caption}
      </figure>`;
    }
    return `<p>${escapeHTML(block.text || '').replace(/\n/g, '<br />')}</p>`;
  }).join('');
}

function toggleLike(storyId){
  const story = state.stories.find(s => s.id === storyId);
  if(!story) return;
  if(state.likes.has(storyId)){
    state.likes.delete(storyId);
    story.likes = Math.max(0, (story.likes || 0) - 1);
    toast('कहानी को पसंद से हटा दिया गया।');
  }else{
    state.likes.add(storyId);
    story.likes = (story.likes || 0) + 1;
    toast('कहानी पसंद की गई। धन्यवाद!');
  }
  saveStories(); saveUser();
  $$(`[data-like-count="${storyId}"]`).forEach(el => {
    el.innerHTML = ICON.heart + ' ' + fmtNum(story.likes);
  });
  $$(`[data-action="like"][data-id="${storyId}"]`).forEach(btn => {
    const on = state.likes.has(storyId);
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', String(on));
    const label = btn.querySelector('span');
    if(label) label.textContent = on ? 'पसंद किया गया' : 'पसंद करें';
  });
}
function toggleBookmark(storyId){
  const story = state.stories.find(s => s.id === storyId);
  if(!story) return;
  if(state.bookmarks.has(storyId)){
    state.bookmarks.delete(storyId);
    toast('बुकमार्क हटा दिया गया।');
  }else{
    state.bookmarks.add(storyId);
    toast('कहानी बुकमार्क कर ली गई।');
  }
  saveUser();
  $$(`[data-action="bookmark"][data-id="${storyId}"]`).forEach(btn => {
    const on = state.bookmarks.has(storyId);
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', String(on));
    if(btn.tagName === 'BUTTON' && !btn.classList.contains('card')) btn.textContent = on ? 'बुकमार्क हटाएँ' : 'बुकमार्क करें';
  });
}
async function shareStory(storyId){
  const story = state.stories.find(s => s.id === storyId);
  if(!story) return;
  const base = location.href.split('#')[0];
  const url = base + '#/story/' + story.id;
  const st = state.settings;
  const title = story.title + ' — ' + st.brandMain + ' ' + st.brandAccent;
  if(navigator.share){
    try{ await navigator.share({ title, text: story.title, url }); return; }
    catch(err){ if(err && err.name === 'AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(url); toast('कहानी का लिंक कॉपी हो गया।'); }
  catch(e){ toast('लिंक कॉपी नहीं हो सका: ' + url); }
}
function setFontSize(px){
  const size = Math.min(FONT_MAX, Math.max(FONT_MIN, px));
  state.prefs.fontSize = size;
  savePrefs();
  $$('.reader-paper').forEach(el => el.style.setProperty('--reader-size', size + 'px'));
  toast('पाठ आकार: ' + size + 'px');
}
function setReaderTheme(theme){
  if(!['light','sepia','dark'].includes(theme)) return;
  state.prefs.theme = theme;
  savePrefs();
  $$('.reader-paper').forEach(el => el.setAttribute('data-theme', theme));
  $$('.theme-dot').forEach(dot => dot.classList.toggle('active', dot.dataset.theme === theme));
}

function adminFilteredStories(){
  let list = state.stories.slice();
  const q = state.adminSearch.trim().toLowerCase();
  if(q){
    list = list.filter(s =>
      String(s.title || '').toLowerCase().includes(q) ||
      String(s.author || '').toLowerCase().includes(q) ||
      String(s.category || '').toLowerCase().includes(q));
  }
  if(state.adminFilter === 'published') list = list.filter(s => s.status === 'published');
  else if(state.adminFilter === 'draft') list = list.filter(s => s.status === 'draft');
  else if(state.adminFilter === 'featured') list = list.filter(s => s.id === state.settings.sections.featuredStoryId);

  if(state.adminSort === 'views') list.sort((a, b) => (b.views || 0) - (a.views || 0));
  else if(state.adminSort === 'likes') list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
  else if(state.adminSort === 'title') list.sort((a, b) => String(a.title || '').localeCompare(String(b.title || ''), 'hi'));
  else list.sort((a, b) => String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || '')));

  return list;
}

    <textarea data-setting="${escapeAttr(path)}" rows="${rows || 3}">${escapeHTML(value ?? '')}</textarea></label>`;
}
function settingsCheckbox(label, path, checked){
  return `<label class="checkbox"><input type="checkbox" data-setting="${escapeAttr(path)}"
    ${checked ? 'checked' : ''} /> ${escapeHTML(label)}</label>`;
}
function settingsSelect(label, path, value, options){
  return `<label class="field"><span class="field-label">${escapeHTML(label)}</span>
    <select data-setting="${escapeAttr(path)}">
      ${options.map(o => `<option value="${escapeAttr(o.value)}" ${String(o.value) === String(value) ? 'selected' : ''}>${escapeHTML(o.label)}</option>`).join('')}
    </select></label>`;
}

function blankStory(){
  const cats = state.settings.categories;
  return {
    id: uid('story'), title: '', author: '',
    category: cats[0] || 'प्रेम', description: '',
    coverImageId: null, status: 'draft', views: 0, likes: 0,
    createdAt: null, updatedAt: null,
    chapters: [{
      id: uid('ch'), title: 'अध्याय 1',
      subchapters: [{ id: uid('sb'), title: 'उप-अध्याय 1.1', blocks: [{ type: 'p', text: '' }] }]
    }]
  };
}
function startNewStory(){ state.editor = { story: blankStory(), isNew: true }; renderEditor(); }
function startEditStory(storyId){
  const story = state.stories.find(s => s.id === storyId);
  if(!story) return;
  state.editor = { story: clone(story), isNew: false };
  renderEditor();
}
function duplicateStory(storyId){
  const story = state.stories.find(s => s.id === storyId);
  if(!story) return;
  const copy = clone(story);
  copy.id = uid('story');
  copy.title = (story.title || 'बिना शीर्षक') + ' (कॉपी)';
  copy.status = 'draft';
  copy.createdAt = new Date().toISOString();
  copy.updatedAt = copy.createdAt;
  copy.views = 0; copy.likes = 0;
  state.stories.unshift(copy);
  saveStories();
  toast('कहानी की प्रतिलिपि बन गई।');
  renderAdmin();
}
function cancelEditor(){
  if(!confirm('बिना सहेजे बाहर निकलें? असहेजे बदलाव खो जाएँगे।')) return;
  state.editor = null;
  renderAdmin();
}
function rerenderEditor(){
  const y = window.scrollY;
  renderEditor();
  window.scrollTo(0, y);
}
function fieldHTML(label, bindPath, value, opts){
  const o = opts || {};
  return `<label class="field">
    <span class="field-label">${escapeHTML(label)}</span>
    <input type="${o.type || 'text'}" data-bind="${escapeAttr(bindPath)}"
           value="${escapeAttr(value ?? '')}" placeholder="${escapeAttr(o.placeholder || '')}" />
  </label>`;
}

  const coverSrc = s.coverImageId && imageURLs.has(s.coverImageId) ? imageURLs.get(s.coverImageId) : null;
  const cats = state.settings.categories.slice();
  if(s.category && !cats.includes(s.category)) cats.push(s.category);

  /* Word count across all blocks */
  let totalWords = 0;
  (s.chapters || []).forEach(ch => (ch.subchapters || []).forEach(sb => {
    (sb.blocks || []).forEach(b => { if(b.type === 'p') totalWords += countWords(b.text); });
  }));

  app.innerHTML = `
  <div class="container admin">
    <div class="admin-head">
      <div>
        <h1>${state.editor.isNew ? 'नई कहानी बनाएँ' : 'कहानी संपादित करें'}</h1>

      </div>
      <div class="admin-actions">
        <button class="btn" data-action="editor-preview">पूर्वावलोकन</button>
        <button class="btn btn-primary" data-action="editor-save">सहेजें</button>

      </div>
    </div>

    <div class="notice">
      यह कहानी <strong>केवल इसी ब्राउज़र</strong> में सहेजी जाएगी। दूसरों तक पहुँचाने के लिए
      बैकअप टैब से JSON निर्यात करें।
      <span style="margin-left:10px;color:var(--gold);font-weight:600">कुल शब्द: ${fmtNum(totalWords)}</span>
    </div>

    <section class="panel">
      <h2 class="panel-title">मूल जानकारी</h2>
      ${fieldHTML('कहानी का शीर्षक *', 'title', s.title, { placeholder: 'उदा. अधूरी दास्तान' })}
      ${fieldHTML('लेखक का नाम *', 'author', s.author, { placeholder: 'उदा. आरव मेहरा' })}
      <label class="field">
        <span class="field-label">श्रेणी</span>
        <select data-bind="category">
          ${cats.map(c => `<option value="${escapeAttr(c)}" ${s.category === c ? 'selected' : ''}>${escapeHTML(c)}</option>`).join('')}
        </select>
      </label>
      <label class="field">
        <span class="field-label">संक्षिप्त विवरण</span>
        <textarea data-bind="description" rows="3"
          placeholder="कहानी के बारे में दो-तीन पंक्तियों में लिखें...">${escapeHTML(s.description || '')}</textarea>
      </label>
      <label class="field">
        <span class="field-label">स्थिति</span>
        <select data-bind="status">
          <option value="draft" ${s.status === 'draft' ? 'selected' : ''}>ड्राफ़्ट (निजी)</option>
          <option value="published" ${s.status === 'published' ? 'selected' : ''}>प्रकाशित</option>
        </select>
      </label>

      <div class="field">
        <span class="field-label">आवरण चित्र</span>
        <div class="cover-uploader">
          <div class="cover-preview" id="coverDropZone">
            ${coverSrc ? `<img src="${coverSrc}" alt="आवरण चित्र" />` : '<span>कोई चित्र नहीं<br/>ड्रैग करके डालें</span>'}
          </div>
          <div class="row-actions">
            <button class="btn btn-sm" data-action="pick-cover">चित्र चुनें</button>
            ${coverSrc ? `<button class="btn btn-sm btn-danger" data-action="remove-cover">हटाएँ</button>` : ''}

            </p>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">अध्याय और उप-अध्याय</h2>
      <div id="chaptersHost">
        ${s.chapters.map((ch, ci) => chapterEditorHTML(ch, ci)).join('')}

      <button class="btn" data-action="chapter-add">+ नया अध्याय जोड़ें</button>

  if(zone){

    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('dragover');
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f){
        state.uploadTarget = { kind: 'cover' };
        handleImageFile(f);
      }
    });
  }

function addChapter(){
  const s = state.editor.story;
  const n = s.chapters.length + 1;
  s.chapters.push({
    id: uid('ch'), title: 'अध्याय ' + n,
    subchapters: [{ id: uid('sb'), title: 'उप-अध्याय ' + n + '.1', blocks: [{ type: 'p', text: '' }] }]
  });
  rerenderEditor();
}
function addSubchapter(ci){
  const s = state.editor.story;
  const ch = s.chapters[ci];
  if(!ch) return;
  const n = ch.subchapters.length + 1;
  ch.subchapters.push({ id: uid('sb'), title: 'उप-अध्याय ' + (ci + 1) + '.' + n, blocks: [{ type: 'p', text: '' }] });
  rerenderEditor();
}
function addBlockText(ci, si){
  const sb = state.editor.story.chapters[ci].subchapters[si];
  sb.blocks.push({ type: 'p', text: '' });
  rerenderEditor();
}
function saveEditor(){
  const s = state.editor.story;
  if(!s.title.trim()){ toast('कृपया कहानी का शीर्षक भरें।'); return; }
  if(!s.author.trim()){ toast('कृपया लेखक का नाम भरें।'); return; }
  if(!s.chapters.length){ toast('कम से कम एक अध्याय जोड़ें।'); return; }
  if(!s.chapters.some(ch => (ch.subchapters || []).length)){ toast('कम से कम एक उप-अध्याय जोड़ें।'); return; }
  const now = new Date().toISOString();
  s.updatedAt = now;
  if(!s.createdAt) s.createdAt = now;
  s.views = s.views || 0;
  s.likes = s.likes || 0;
  if(state.editor.isNew) state.stories.unshift(s);
  else{
    const idx = state.stories.findIndex(x => x.id === s.id);
    if(idx >= 0) state.stories[idx] = s;
    else state.stories.unshift(s);
  }
  saveStories();
  state.editor = null;
  toast('कहानी सहेज दी गई।');
  renderAdmin();
}
function deleteStory(storyId){
  const story = state.stories.find(s => s.id === storyId);
  if(!story) return;
  if(!confirm(`“${story.title}” को स्थायी रूप से हटाएँ? यह वापस नहीं होगा।`)) return;
  state.stories = state.stories.filter(s => s.id !== storyId);
  state.likes.delete(storyId);
  state.bookmarks.delete(storyId);
  delete state.progress[storyId];
  if(state.settings.sections.featuredStoryId === storyId){
    state.settings.sections.featuredStoryId = '';
    saveSettings();
  }
  saveStories(); saveUser();
  toast('कहानी हटा दी गई।');
  renderAdmin();
}
function togglePublish(storyId){
  const story = state.stories.find(s => s.id === storyId);
  if(!story) return;
  story.status = story.status === 'published' ? 'draft' : 'published';
  story.updatedAt = new Date().toISOString();
  saveStories();
  toast(story.status === 'published' ? 'कहानी प्रकाशित कर दी गई।' : 'कहानी अप्रकाशित कर दी गई।');
  renderAdmin();
}

async function exportJSON(){
  try{
    const ids = new Set();
    state.stories.forEach(story => {
      if(story.coverImageId) ids.add(story.coverImageId);
      (story.chapters || []).forEach(ch => (ch.subchapters || []).forEach(sb => {
        (sb.blocks || []).forEach(b => { if(b.type === 'img' && b.imageId) ids.add(b.imageId); });
      }));
    });
    const images = {};
    if(db){
      for(const id of ids){
        try{
          const rec = await dbGet(id);
          if(rec && rec.blob){
            images[id] = {
              name: rec.name || 'image', type: rec.type || rec.blob.type,
              data: await blobToDataURL(rec.blob)
            };
          }
        }catch(e){}
      }
    }
    const payload = {
      app: 'कथा संसार', version: 2,
      exportedAt: new Date().toISOString(),
      note: 'बैकअप में कहानियाँ, चित्र (base64) और साइट सेटिंग्स शामिल हैं।',
      settings: state.settings,
      stories: state.stories,
      images
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'katha-sansar-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('JSON बैकअप डाउनलोड हो गया।');
  }catch(err){
    console.error(err);
    toast('बैकअप बनाते समय त्रुटि हुई।');
  }
}

async function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  if(file.size > 80 * 1024 * 1024){ toast('फ़ाइल बहुत बड़ी है।'); return; }
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.stories)){
      toast('यह मान्य बैकअप फ़ाइल नहीं है।'); return;
    }
    if(!confirm('आयात करने पर वर्तमान कहानियाँ और सेटिंग्स बदल जाएँगी। जारी रखें?')) return;

    if(data.settings && typeof data.settings === 'object'){
      state.settings = deepMerge(clone(DEFAULT_SETTINGS), data.settings);
      if(!Array.isArray(state.settings.categories) || !state.settings.categories.length){
        state.settings.categories = clone(DEFAULT_SETTINGS.categories);
      }
      saveSettings();
    }
    if(data.images && typeof data.images === 'object' && db){
      for(const id of Object.keys(data.images)){
        try{
          const rec = data.images[id];
          if(!rec || !rec.data) continue;
          const blob = await dataURLToBlob(rec.data);
          await dbPut({ id, blob, name: rec.name || 'image', type: rec.type || blob.type,
                        size: blob.size, uploadedAt: new Date().toISOString() });
        }catch(err){ console.warn('Image import failed', id, err); }
      }
    }
    state.stories = data.stories.map(story => ({
      id: story.id || uid('story'),
      title: story.title || 'बिना शीर्षक',
      author: story.author || 'अज्ञात',
      category: story.category || state.settings.categories[0] || 'प्रेम',
      description: story.description || '',
      coverImageId: story.coverImageId || null,
      status: story.status === 'published' ? 'published' : 'draft',
      views: Number(story.views) || 0,
      likes: Number(story.likes) || 0,
      createdAt: story.createdAt || new Date().toISOString(),
      updatedAt: story.updatedAt || story.createdAt || new Date().toISOString(),
      chapters: Array.isArray(story.chapters) ? story.chapters.map(ch => ({
        id: ch.id || uid('ch'),
        title: ch.title || 'अध्याय',
        subchapters: Array.isArray(ch.subchapters) ? ch.subchapters.map(sb => ({
          id: sb.id || uid('sb'),
          title: sb.title || 'उप-अध्याय',
          blocks: Array.isArray(sb.blocks) ? sb.blocks.map(b => b.type === 'img'
            ? { type: 'img', imageId: b.imageId || null, caption: b.caption || '', alt: b.alt || '' }
            : { type: 'p', text: b.text || '' }) : []
        })) : []
      })) : []
    }));
    saveStories();
    await loadImages();
    applySettingsToChrome();
    toast('बैकअप आयात हो गया।');
    renderAdmin();
  }catch(err){
    console.error(err);
    toast('फ़ाइल पढ़ने में त्रुटि हुई।');
  }
}

async function resetToSamples(){
  if(!confirm('सभी स्थानीय कहानियाँ, चित्र, आँकड़े और सेटिंग्स हटाकर नमूना डेटा फिर से लोड करें?')) return;
  state.stories = [];
  state.likes.clear(); state.bookmarks.clear();
  state.progress = {}; state.editor = null;
  state.search = ''; state.category = 'सभी';
  state.adminTab = 'dashboard'; state.adminSearch = '';
  state.settings = clone(DEFAULT_SETTINGS);

  imageURLs.clear();
  await seedData();
  await loadImages();
  applySettingsToChrome();
  toast('नमूना डेटा फिर से लोड हो गया।');

}

function pickImage(target){
  if(!db){ toast('इस ब्राउज़र में चित्र संग्रहण उपलब्ध नहीं है।'); return; }

function validateImage(file){
  if(!file) return 'कोई फ़ाइल नहीं चुनी गई।';
  if(!file.type || !file.type.startsWith('image/')) return 'कृपया केवल चित्र फ़ाइल चुनें।';
  if(file.size > MAX_IMAGE_BYTES) return 'चित्र 5MB से बड़ा है।';
  return null;
}
async function handleImageFile(file){
  const target = state.uploadTarget;
  state.uploadTarget = null;
  if(!file || !target) return;
  const error = validateImage(file);
  if(error){ toast(error); return; }
  try{
    const id = await saveImageBlob(file, file.name);
    if(target.kind === 'cover'){
      if(!state.editor) return;
      state.editor.story.coverImageId = id;
      rerenderEditor();
      toast('आवरण चित्र जोड़ दिया गया।');
      return;
    }
    if(target.kind === 'block' && state.editor){
      const sb = state.editor.story.chapters[target.ci].subchapters[target.si];
      if(!sb) return;
      if(typeof target.bi === 'number'){
        sb.blocks[target.bi].imageId = id;
        toast('चित्र बदल दिया गया।');
      }else{
        sb.blocks.push({ type: 'img', imageId: id, caption: '', alt: '' });
        toast('चित्र जोड़ दिया गया।');
      }
      rerenderEditor();
    }
  }catch(err){
    console.error(err);
    toast('चित्र सहेजते समय त्रुटि हुई।');
  }
}

async function deleteImage(imageId){
  const usage = imageUsageCount(imageId);
  const msg = usage
    ? `यह चित्र ${usage} जगह उपयोग हो रहा है। हटाने पर वहाँ “चित्र उपलब्ध नहीं” दिखेगा। हटाएँ?`
    : 'यह चित्र हटाएँ?';
  if(!confirm(msg)) return;
  try{
    if(db) await dbDelete(imageId);
    const url = imageURLs.get(imageId);
    if(url){ URL.revokeObjectURL(url); imageURLs.delete(imageId); }
    toast('चित्र हटा दिया गया।');
    renderAdminTab('media');
  }catch(err){
    console.error(err);
    toast('चित्र हटाते समय त्रुटि हुई।');
  }
}
