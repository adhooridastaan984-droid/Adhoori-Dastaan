<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f18" />
<title>कथा संसार — लेखक पैनल</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Mukta:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0a0f18; --bg-2:#0f1626; --card:#131c2e; --card-2:#0d1524;
  --line:rgba(226,192,122,.18); --line-soft:rgba(255,255,255,.07);
  --gold:#e2c07a; --gold-dim:#b99a58; --text:#e8e4dc; --muted:#93a0b8;
  --danger:#e26d6d; --ok:#6fd39a; --info:#8fb6f0;
  --radius:16px; --shadow:0 22px 50px -26px rgba(0,0,0,.9);
  --serif:'Noto Serif Devanagari',Georgia,serif;
  --sans:'Mukta','Noto Sans Devanagari',system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}a{color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.3;margin:0}
p{margin:0}button{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* Header */
.header{position:sticky;top:0;z-index:80;background:rgba(10,15,24,.92);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.header-inner{max-width:1280px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:22px;font-weight:700;
  text-decoration:none;color:var(--text);white-space:nowrap}
.brand span{color:var(--gold)}
.header-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line-soft);background:rgba(255,255,255,.03);
  color:var(--text);padding:9px 16px;border-radius:999px;
  font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;
  transition:all .18s;line-height:1.4;white-space:nowrap}
.btn:hover{background:rgba(226,192,122,.11);border-color:var(--line)}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#ecd39a,#d0a95e);
  border-color:transparent;color:#1c1407;font-weight:700}
.btn-primary:hover{filter:brightness(1.06)}
.btn-danger{color:var(--danger);border-color:rgba(226,109,109,.35)}
.btn-danger:hover{background:rgba(226,109,109,.13);border-color:rgba(226,109,109,.6)}
.btn-ok{color:var(--ok);border-color:rgba(111,211,154,.35)}
.btn-ok:hover{background:rgba(111,211,154,.13)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-xs{padding:4px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Layout */
.container{max-width:1280px;margin:0 auto;padding:0 20px}
.main{padding:24px 0 80px}

/* Tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);
  margin-bottom:24px;position:sticky;top:57px;z-index:20;
  background:rgba(10,15,24,.95);backdrop-filter:blur(10px);padding:8px 0}
.tab{padding:9px 16px;cursor:pointer;font-family:var(--sans);
  font-size:14px;font-weight:600;color:var(--muted);
  background:transparent;border:1px solid transparent;
  border-radius:11px;transition:all .18s;
  display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tab.active{color:var(--gold);background:var(--card);border-color:var(--line)}
.tab .badge{background:rgba(226,192,122,.22);color:var(--gold);
  font-size:11px;padding:1px 7px;border-radius:999px;font-weight:700}

/* Panel */
.panel{background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:22px;margin-bottom:20px}
.panel-title{font-size:1.1rem;color:var(--gold);margin:0 0 16px;
  padding-bottom:12px;border-bottom:1px solid var(--line-soft)}

/* Field */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field-label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=search],input[type=number],textarea,select{
  font-family:var(--sans);background:var(--card-2);color:var(--text);
  border:1px solid var(--line-soft);border-radius:11px;
  padding:11px 14px;font-size:15px;outline:none;width:100%;
  transition:border-color .18s,box-shadow .18s;line-height:1.55}
input:focus,textarea:focus,select:focus{
  border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,192,122,.1)}
textarea{resize:vertical;min-height:70px}
select{cursor:pointer}
.checkbox{display:flex;align-items:center;gap:10px;font-size:14.5px;
  color:var(--muted);cursor:pointer;user-select:none;margin-bottom:16px}
.checkbox input{width:18px;height:18px;accent-color:var(--gold);cursor:pointer;flex-shrink:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 18px}

/* Notices */
.notice{background:rgba(226,192,122,.07);border:1px solid var(--line);
  border-radius:12px;padding:13px 16px;font-size:13.5px;
  color:#d7cfc0;line-height:1.7;margin-bottom:18px}
.notice strong{color:var(--gold)}
.notice.info{background:rgba(110,160,235,.07);border-color:rgba(110,160,235,.25)}
.notice.info strong{color:var(--info)}
.notice.danger{background:rgba(226,109,109,.07);border-color:rgba(226,109,109,.25)}
.notice.danger strong{color:var(--danger)}

/* Empty */
.empty{text-align:center;padding:52px 22px;border:1px dashed var(--line-soft);
  border-radius:var(--radius);color:var(--muted);background:rgba(255,255,255,.015)}
.empty h3{color:var(--text);margin-bottom:8px;font-size:1.1rem}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--line-soft);
  border-radius:14px;padding:16px 18px;transition:border-color .18s}
.stat-card:hover{border-color:var(--line)}
.stat-label{font-size:12px;color:var(--muted);font-weight:600;
  letter-spacing:.4px;text-transform:uppercase}
.stat-value{font-family:var(--serif);font-size:1.9rem;font-weight:700;
  color:var(--gold);line-height:1.15;margin-top:4px}
.stat-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* Quick actions */
.quick-actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.quick-action{background:var(--card);border:1px solid var(--line-soft);
  border-radius:12px;padding:14px 12px;cursor:pointer;text-align:center;
  color:var(--muted);font-size:13px;font-weight:600;transition:all .18s;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.quick-action:hover{color:var(--gold);border-color:var(--gold);
  background:rgba(226,192,122,.06);transform:translateY(-2px)}
.quick-action .qa-icon{font-size:22px;line-height:1}
.dash-two{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* Recent list */
.recent-list{display:flex;flex-direction:column;gap:8px}
.recent-item{display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:11px;background:rgba(255,255,255,.02);
  border:1px solid transparent;transition:border-color .18s}
.recent-item:hover{border-color:var(--line-soft)}
.recent-thumb{width:44px;height:44px;border-radius:8px;overflow:hidden;
  background:#0c1320;flex-shrink:0}
.recent-thumb img{width:100%;height:100%;object-fit:cover}
.recent-info{flex:1;min-width:0}
.recent-title{font-size:14px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.recent-meta{font-size:12px;color:var(--muted)}

/* Toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  background:var(--card);border:1px solid var(--line-soft);
  border-radius:12px;padding:12px 14px;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:170px;padding:9px 14px;border-radius:9px}
.toolbar select{padding:9px 14px;border-radius:9px;width:auto;min-width:130px}
.toolbar .count{color:var(--muted);font-size:13px;white-space:nowrap;margin-inline-start:auto}

/* Story list */
.story-list{display:flex;flex-direction:column;gap:10px}
.story-row{display:grid;grid-template-columns:60px 1fr auto;gap:14px;
  align-items:center;background:var(--card);border:1px solid var(--line-soft);
  border-radius:12px;padding:12px 16px;transition:border-color .18s}
.story-row:hover{border-color:var(--line)}
.story-thumb{width:60px;height:60px;border-radius:9px;overflow:hidden;background:#0c1320}
.story-thumb img{width:100%;height:100%;object-fit:cover}
.story-row h3{font-size:1rem;margin-bottom:3px;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.story-row .meta{color:var(--muted);font-size:12.5px;
  display:flex;gap:12px;flex-wrap:wrap}
.story-row .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge-status{font-size:11px;padding:2px 9px;border-radius:999px;
  font-weight:700;border:1px solid transparent}
.badge-status.published{color:var(--ok);background:rgba(111,211,154,.1);
  border-color:rgba(111,211,154,.3)}
.badge-status.draft{color:#e0b877;background:rgba(224,184,119,.1);
  border-color:rgba(224,184,119,.3)}
.badge-status.featured{color:var(--gold);background:rgba(226,192,122,.1);
  border-color:var(--line)}

/* Editor */
.cover-uploader{display:grid;grid-template-columns:130px 1fr;gap:16px;
  align-items:center;background:var(--card-2);
  border:1px solid var(--line-soft);border-radius:12px;padding:14px}
.cover-preview{aspect-ratio:3/4;border-radius:9px;overflow:hidden;
  background:#0a1120;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:12px;text-align:center;padding:8px;
  transition:all .18s}
.cover-preview img{width:100%;height:100%;object-fit:cover}
.cover-preview.dragover{outline:2px dashed var(--gold);outline-offset:2px;
  background:rgba(226,192,122,.1)}
.chapter-block{background:#0f1828;border:1px solid var(--line-soft);
  border-radius:12px;padding:16px;margin-bottom:14px}
.sub-block{background:#0b1322;border:1px solid var(--line-soft);
  border-radius:10px;padding:14px;margin-top:12px}
.row-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.row-head input[type=text]{flex:1;min-width:170px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.icon-btn{width:32px;height:32px;border-radius:8px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--line-soft);
  color:var(--muted);font-size:14px;display:inline-flex;
  align-items:center;justify-content:center;transition:all .18s;padding:0}
.icon-btn:hover{color:var(--gold);border-color:var(--gold)}
.icon-btn.danger:hover{color:var(--danger);border-color:rgba(226,109,109,.6)}
.block{background:#0a1020;border:1px dashed rgba(255,255,255,.09);
  border-radius:10px;padding:11px;margin-bottom:10px}
.block textarea{min-height:80px;font-family:var(--serif);
  font-size:15.5px;line-height:1.9}
.block-img img{width:100%;max-height:260px;object-fit:cover;
  border-radius:9px;display:block;margin-bottom:10px}
.block-type{font-size:11px;letter-spacing:1px;text-transform:uppercase;
  color:var(--gold-dim);font-weight:700}
.block-tools{display:flex;justify-content:space-between;align-items:center;
  gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sub-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.word-count{font-size:12px;color:var(--muted);margin-inline-start:auto}
.word-count b{color:var(--gold)}
.save-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 40px}

/* Categories */
.cat-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  background:var(--card-2);border:1px solid var(--line-soft);
  border-radius:11px;padding:10px 12px}
.cat-row input[type=text]{flex:1;min-width:150px}
.cat-count{font-size:12.5px;color:var(--muted);white-space:nowrap;
  background:rgba(255,255,255,.04);padding:4px 10px;border-radius:7px}

/* Media */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.media-card{background:var(--card);border:1px solid var(--line-soft);
  border-radius:12px;overflow:hidden;transition:all .18s}
.media-card:hover{border-color:var(--line);transform:translateY(-2px)}
.media-thumb{aspect-ratio:1;overflow:hidden;background:#0c1320;
  display:flex;align-items:center;justify-content:center}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-info{padding:10px 12px 4px}
.media-name{font-size:12.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--text)}
.media-meta{font-size:11px;color:var(--muted);display:flex;
  justify-content:space-between;margin-top:2px}
.media-actions{display:flex;gap:4px;padding:8px 10px 10px}
.media-usage{font-size:11px;color:var(--gold);padding:0 12px 8px}

/* Preview */
.preview-overlay{position:fixed;inset:0;z-index:150;background:var(--bg);
  overflow-y:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.preview-bar{position:sticky;top:0;z-index:2;display:flex;
  justify-content:space-between;align-items:center;gap:12px;
  padding:12px 20px;background:rgba(10,15,24,.95);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.preview-bar strong{font-family:var(--serif);color:var(--gold);font-size:15px}
.preview-body{max-width:1000px;margin:0 auto;padding:24px 20px 70px}

/* Toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
  background:#1b2436;color:var(--text);border:1px solid var(--line);
  border-radius:12px;padding:12px 20px;font-size:14px;z-index:300;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:min(92vw,520px);
  text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Responsive */
@media (max-width:820px){
  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .dash-two{grid-template-columns:1fr}
  .cover-uploader{grid-template-columns:1fr}
  .cover-preview{aspect-ratio:16/9;max-height:170px}
  .story-row{grid-template-columns:54px 1fr}
  .story-row .actions{grid-column:1/-1;justify-content:flex-start}
  .tabs{top:52px;overflow-x:auto;flex-wrap:nowrap;padding:6px 0}
  .tab{flex-shrink:0}
  .media-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
@media (max-width:520px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat-value{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="brand" href="#" id="brandLink">कथा <span>संसार</span></a>
    <div class="header-actions">
      <button class="btn btn-sm" data-action="preview-site">साइट प्रीव्यू</button>
      <a class="btn btn-sm btn-primary" href="#" data-action="new-story">+ नई कहानी</a>
    </div>
  </div>
</header>

<main class="main">
  <div class="container">
    <div style="margin-bottom:18px">
      <h1 style="font-size:1.7rem">लेखक पैनल</h1>
      <p style="color:var(--muted);font-size:14px;margin-top:4px">
        यहाँ से कहानियाँ, चित्र, श्रेणियाँ और साइट सेटिंग्स — सब कुछ प्रबंधित करें।
      </p>
    </div>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="view"></div>
  </div>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept="image/*" hidden />

<script>
(function(){
'use strict';

/* =====================================================================
   CONSTANTS
   ===================================================================== */
const LS_SETTINGS = 'ks.admin.settings.v1';
const LS_STORIES  = 'ks.admin.stories.v1';
const DB_NAME     = 'ks.admin.images.v1';
const DB_STORE    = 'images';
const MAX_IMAGE   = 5 * 1024 * 1024;

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function fmt(n){return Number(n||0).toLocaleString('hi-IN')}
function fmtDate(iso){
  if(!iso)return'';
  try{return new Date(iso).toLocaleDateString('hi-IN',{day:'numeric',month:'long',year:'numeric'})}
  catch(e){return''}
}
function fmtBytes(b){
  if(!b)return'0 B';
  const u=['B','KB','MB','GB'];let i=0,n=b;
  while(n>=1024&&i<u.length-1){n/=1024;i++}
  return n.toFixed(n<10&&i>0?1:0)+' '+u[i];
}
function words(t){
  if(!t)return 0;
  return String(t).trim().split(/\s+/).filter(Boolean).length;
}
function clone(o){return JSON.parse(JSON.stringify(o))}

let toastTimer=null;
function toast(msg){
  const el=$('#toast');if(!el)return;
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),3000);
}

/* =====================================================================
   DEFAULT SETTINGS
   ===================================================================== */
const DEFAULT_SETTINGS = {
  brandMain:'कथा', brandAccent:'संसार',
  siteTitle:'कथा संसार — हिंदी कहानियों का डिजिटल संसार',
  categories:['प्रेम','रहस्य','रोमांच','प्रेरणा','काल्पनिक','सामाजिक'],
  hero:{
    eyebrow:'हिंदी कहानियों का डिजिटल संसार',
    title:'हर कहानी में एक नई दुनिया',
    subtitle:'पढ़िए, महसूस कीजिए और कहानियों के साथ एक नया सफर शुरू कीजिए।'
  },
  footer:{
    tagline:'हिंदी कहानियों का एक छोटा-सा डिजिटल घर।',
    aboutTitle:'हमारे बारे में',
    aboutText:'कथा संसार एक स्वतंत्र हिंदी कहानी मंच है।',
    contactTitle:'संपर्क',
    email:'hello@kathasansar.example'
  }
};

/* =====================================================================
   STATE
   ===================================================================== */
const state = {
  settings: clone(DEFAULT_SETTINGS),
  stories: [],
  tab: 'dashboard',
  editing: null,       // {story, isNew}
  search: '',
  filter: 'all',
  sort: 'recent'
};

const imageURLs = new Map();
let db = null;

/* =====================================================================
   PERSISTENCE
   ===================================================================== */
function loadSettings(){
  try{
    const raw = localStorage.getItem(LS_SETTINGS);
    if(raw){
      const p = JSON.parse(raw);
      state.settings = Object.assign(clone(DEFAULT_SETTINGS), p||{});
      if(!Array.isArray(state.settings.categories)||!state.settings.categories.length){
        state.settings.categories = clone(DEFAULT_SETTINGS.categories);
      }
    }
  }catch(e){}
}
function saveSettings(){
  try{localStorage.setItem(LS_SETTINGS,JSON.stringify(state.settings))}
  catch(e){toast('सेटिंग्स सहेजी नहीं जा सकीं')}
}
function loadStories(){
  try{
    const raw = localStorage.getItem(LS_STORIES);
    if(raw){
      const p = JSON.parse(raw);
      if(Array.isArray(p)) state.stories = p;
    }
  }catch(e){}
}
function saveStories(){
  try{localStorage.setItem(LS_STORIES,JSON.stringify(state.stories))}
  catch(e){
    console.error(e);
    toast('स्टोरेज भर गया — कुछ कहानियाँ हटाएँ');
  }
}

/* IndexedDB */
function openDB(){
  return new Promise((res,rej)=>{
    if(!('indexedDB' in window))return rej(new Error('no idb'));
    const r = indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE,{keyPath:'id'});
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function dbPut(rec){
  return new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(rec);
    tx.oncomplete=()=>res(true);
    tx.onerror=()=>rej(tx.error);
  });
}
function dbGet(id){
  return new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,'readonly');
    const r=tx.objectStore(DB_STORE).get(id);
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function dbAll(){
  return new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,'readonly');
    const r=tx.objectStore(DB_STORE).getAll();
    r.onsuccess=()=>res(r.result||[]);
    r.onerror=()=>rej(r.error);
  });
}
function dbDelete(id){
  return new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete=()=>res(true);
    tx.onerror=()=>rej(tx.error);
  });
}
function dbClear(){
  return new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).clear();
    tx.oncomplete=()=>res(true);
    tx.onerror=()=>rej(tx.error);
  });
}

async function saveBlob(blob,name){
  if(!db) throw new Error('no idb');
  const id = uid('img');
  await dbPut({id,blob,name:name||'image',type:blob.type,size:blob.size,
               uploadedAt:new Date().toISOString()});
  imageURLs.set(id,URL.createObjectURL(blob));
  return id;
}
async function loadAllImages(){
  if(!db) return;
  try{
    const recs = await dbAll();
    imageURLs.forEach(u=>URL.revokeObjectURL(u));
    imageURLs.clear();
    recs.forEach(r=>{if(r&&r.blob) imageURLs.set(r.id,URL.createObjectURL(r.blob))});
  }catch(e){console.warn(e)}
}
function blobToDataURL(b){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(r.error);
    r.readAsDataURL(b);
  });
}
async function dataURLToBlob(u){
  return await (await fetch(u)).blob();
}

function filteredStories(){
  let list = state.stories.slice();
  const q = state.search.trim().toLowerCase();
  if(q){
    list = list.filter(s=>
      String(s.title||'').toLowerCase().includes(q)||
      String(s.author||'').toLowerCase().includes(q)||
      String(s.category||'').toLowerCase().includes(q));
  }
  if(state.filter==='published') list = list.filter(s=>s.status==='published');
  else if(state.filter==='draft') list = list.filter(s=>s.status==='draft');

  if(state.sort==='views') list.sort((a,b)=>(b.views||0)-(a.views||0));
  else if(state.sort==='likes') list.sort((a,b)=>(b.likes||0)-(a.likes||0));
  else if(state.sort==='title') list.sort((a,b)=>String(a.title||'').localeCompare(String(b.title||''),'hi'));
  else list.sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));

  return list;
}

function countImageUsage(imgId){
  let n=0;
  state.stories.forEach(s=>{
    if(s.coverImageId===imgId) n++;
    (s.chapters||[]).forEach(c=>(c.subchapters||[]).forEach(sb=>
      (sb.blocks||[]).forEach(b=>{if(b.type==='img'&&b.imageId===imgId) n++})));
  });
  return n;
}

/* Bind cover drop zone */
function bindEditor(){
  const zone = $('#coverDrop');
  if(!zone) return;
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{
    e.preventDefault();
    zone.classList.remove('dragover');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) uploadImage(f,{kind:'cover'});
  });
}

/* =====================================================================
   EDITOR ACTIONS
   ===================================================================== */
function setPath(obj,path,val){
  const keys=String(path).split('.');
  let cur=obj;
  for(let i=0;i<keys.length-1;i++){
    if(cur==null) return;
    if(!(keys[i] in cur)) cur[keys[i]]={};
    cur=cur[keys[i]];
  }
  if(cur) cur[keys[keys.length-1]]=val;
}
function moveItem(arr,from,to){
  if(to<0||to>=arr.length||from<0||from>=arr.length) return;
  const [x]=arr.splice(from,1);
  arr.splice(to,0,x);
}

function editorSave(){
  const s = state.editing.story;
  if(!s.title.trim()){toast('कृपया शीर्षक भरें।');return}
  if(!s.author.trim()){toast('कृपया लेखक का नाम भरें।');return}
  if(!s.chapters.length){toast('कम से कम एक अध्याय जोड़ें।');return}
  if(!s.chapters.some(c=>(c.subchapters||[]).length)){toast('कम से कम एक उप-अध्याय जोड़ें।');return}

  const now = new Date().toISOString();
  s.updatedAt = now;
  if(!s.createdAt) s.createdAt = now;
  s.views = s.views||0; s.likes = s.likes||0;

  if(state.editing.isNew) state.stories.unshift(s);
  else{
    const i = state.stories.findIndex(x=>x.id===s.id);
    if(i>=0) state.stories[i]=s;
    else state.stories.unshift(s);
  }
  saveStories();
  state.editing=null;
  toast('कहानी सहेज दी गई।');
  renderShell();
}

function editorCancel(){
  if(!confirm('बिना सहेजे बाहर निकलें?')) return;
  state.editing=null;
  renderShell();
}

async function uploadImage(file,target){
  if(!db){toast('IndexedDB उपलब्ध नहीं');return}
  if(!file||!file.type||!file.type.startsWith('image/')){toast('केवल चित्र फ़ाइल चुनें');return}
  if(file.size>MAX_IMAGE){toast('चित्र 5MB से बड़ा है');return}
  try{
    const id = await saveBlob(file,file.name);
    if(target.kind==='cover'){
      state.editing.story.coverImageId = id;
      renderShell();
      toast('आवरण चित्र जोड़ा गया');
    }else if(target.kind==='block'){
      const sb = state.editing.story.chapters[target.ci].subchapters[target.si];
      if(typeof target.bi==='number') sb.blocks[target.bi].imageId = id;
      else sb.blocks.push({type:'img',imageId:id,caption:'',alt:''});
      renderShell();
      toast('चित्र जोड़ा गया');
    }
  }catch(e){
    console.error(e);
    toast('चित्र सहेजते समय त्रुटि');
  }
}

              <span style="font-size:11px;color:var(--gold);background:rgba(226,192,122,.1);border:1px solid var(--line);padding:3px 10px;border-radius:999px;letter-spacing:1px">${esc(s.category||'कहानी')}</span>
              <h1 style="font-size:1.8rem;margin-top:10px">${esc(s.title||'बिना शीर्षक')}</h1>
              <p style="color:var(--muted);margin-top:8px">${esc(s.description||'')}</p>
              <p style="color:var(--muted);font-size:13px;margin-top:12px">
                ${esc(s.author||'अज्ञात')} · ${fmt((s.chapters||[]).reduce((n,c)=>n+(c.subchapters||[]).length,0))} उप-अध्याय
              </p>
            </div>
          </div>
        </div>
        ${s.chapters.map((ch,ci)=>`
          <div style="background:#f9f5ec;color:#241f18;border-radius:16px;padding:28px;margin-bottom:18px;font-family:var(--serif)">
            <p style="font-size:12px;color:#8b7d66;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">अध्याय ${ci+1}</p>
            <h2 style="font-size:1.4rem;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(0,0,0,.1);color:#241f18">${esc(ch.title)}</h2>
            ${(ch.subchapters||[]).map((sb,si)=>`
              <div style="margin-bottom:24px">
                <h3 style="font-size:1.1rem;margin-bottom:14px;color:#241f18">${ci+1}.${si+1} ${esc(sb.title)}</h3>
                <div style="font-size:17px;line-height:2;color:#241f18">
                  ${(sb.blocks||[]).map(b=>{
                    if(b.type==='img'){
                      const src = b.imageId&&imageURLs.has(b.imageId)?imageURLs.get(b.imageId):null;
                      return src
                        ?`<figure style="margin:18px 0"><img src="${src}" style="width:100%;border-radius:10px;display:block"/>${b.caption?`<figcaption style="text-align:center;font-size:13px;color:#6d6455;margin-top:8px">${esc(b.caption)}</figcaption>`:''}</figure>`
                        :`<div style="border:1px dashed #ccc;border-radius:10px;padding:30px;text-align:center;color:#999;font-size:13px">चित्र उपलब्ध नहीं</div>`;
                    }
                    return `<p style="margin:0 0 16px">${esc(b.text||'').replace(/\n/g,'<br/>')}</p>`;
                  }).join('')}
                </div>
              </div>`).join('')}
          </div>`).join('')}
      ` : `
        <div style="text-align:center;padding:40px 20px;border-bottom:1px solid var(--line-soft);margin-bottom:30px">
          <span style="font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase">${esc(st.hero.eyebrow)}</span>
          <h1 style="font-size:2.2rem;margin:14px 0">${esc(st.hero.title)}</h1>
          <p style="color:var(--muted);max-width:500px;margin:0 auto">${esc(st.hero.subtitle)}</p>
        </div>
        <h2 style="color:var(--gold);margin-bottom:16px">प्रकाशित कहानियाँ (${stories.length})</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px">
          ${stories.map(x=>`
            <div style="background:var(--card);border:1px solid var(--line-soft);border-radius:14px;overflow:hidden">
              <div style="aspect-ratio:16/10;overflow:hidden"><img src="${coverURL(x)}" style="width:100%;height:100%;object-fit:cover" alt=""/></div>
              <div style="padding:14px">
                <div style="font-size:10px;color:var(--gold);letter-spacing:1px;text-transform:uppercase">${esc(x.category)}</div>
                <div style="font-family:var(--serif);font-size:1.05rem;margin-top:6px">${esc(x.title)}</div>
                <div style="color:var(--muted);font-size:12px;margin-top:4px">${esc(x.author)}</div>
              </div>
            </div>`).join('')}
        </div>
        ${stories.length===0?'<div class="empty"><h3>कोई प्रकाशित कहानी नहीं</h3></div>':''}
      `}
    </div>
  </div>`;

  document.body.insertAdjacentHTML('beforeend', html);
  document.body.style.overflow = 'hidden';
}
function closePreview(){
  const el = $('#prevOverlay');
  if(el) el.remove();
  document.body.style.overflow='';
}

/* =====================================================================
   IMPORT / EXPORT / RESET
   ===================================================================== */
async function exportJSON(){
  try{
    const ids = new Set();
    state.stories.forEach(s=>{
      if(s.coverImageId) ids.add(s.coverImageId);
      (s.chapters||[]).forEach(c=>(c.subchapters||[]).forEach(sb=>
        (sb.blocks||[]).forEach(b=>{if(b.type==='img'&&b.imageId) ids.add(b.imageId)})));
    });

    const images = {};
    if(db){
      for(const id of ids){
        try{
          const rec = await dbGet(id);
          if(rec&&rec.blob){
            images[id] = {
              name: rec.name||'image',
              type: rec.type||rec.blob.type,
              data: await blobToDataURL(rec.blob)
            };
          }
        }catch(e){}
      }
    }

    const payload = {
      app:'कथा संसार', version:1,
      exportedAt: new Date().toISOString(),
      settings: state.settings,
      stories: state.stories,
      images
    };
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'katha-sansar-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('बैकअप डाउनलोड हो गया।');
  }catch(e){
    console.error(e);
    toast('बैकअप बनाने में त्रुटि');
  }
}

async function importJSON(file){
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data||!Array.isArray(data.stories)){
      toast('मान्य बैकअप फ़ाइल नहीं है');return;
    }
    if(!confirm('वर्तमान कहानियाँ और सेटिंग्स बदल जाएँगी। जारी रखें?')) return;

    if(data.settings) state.settings = Object.assign(clone(DEFAULT_SETTINGS),data.settings);
    saveSettings();

    if(data.images&&db){
      for(const id of Object.keys(data.images)){
        try{
          const rec = data.images[id];
          if(!rec||!rec.data) continue;
          const blob = await dataURLToBlob(rec.data);
          await dbPut({id,blob,name:rec.name||'image',type:rec.type||blob.type,
                       size:blob.size,uploadedAt:new Date().toISOString()});
        }catch(e){console.warn(e)}
      }
    }

    state.stories = data.stories.map(s=>({
      id:s.id||uid('story'),
      title:s.title||'बिना शीर्षक',
      author:s.author||'अज्ञात',
      category:s.category||state.settings.categories[0]||'प्रेम',
      description:s.description||'',
      coverImageId:s.coverImageId||null,
      status:s.status==='published'?'published':'draft',
      views:Number(s.views)||0,
      likes:Number(s.likes)||0,
      createdAt:s.createdAt||new Date().toISOString(),
      updatedAt:s.updatedAt||s.createdAt||new Date().toISOString(),
      chapters: Array.isArray(s.chapters)?s.chapters.map(c=>({
        id:c.id||uid('ch'),
        title:c.title||'अध्याय',
        subchapters: Array.isArray(c.subchapters)?c.subchapters.map(sb=>({
          id:sb.id||uid('sb'),
          title:sb.title||'उप-अध्याय',
          blocks: Array.isArray(sb.blocks)?sb.blocks.map(b=>b.type==='img'
            ?{type:'img',imageId:b.imageId||null,caption:b.caption||'',alt:b.alt||''}
            :{type:'p',text:b.text||''}):[]
        })):[]
      })):[]
    }));

    saveStories();
    await loadAllImages();
    toast('बैकअप आयात हो गया।');
    renderShell();
  }catch(e){
    console.error(e);
    toast('फ़ाइल पढ़ने में त्रुटि');
  }
}

async function resetAll(){
  if(!confirm('सब कुछ हटाकर नमूना डेटा फिर से लोड करें? यह वापस नहीं होगा।')) return;
  try{
    if(db) await dbClear();
  }catch(e){}
  imageURLs.forEach(u=>URL.revokeObjectURL(u));
  imageURLs.clear();
  state.settings = clone(DEFAULT_SETTINGS);
  state.stories = sampleStories();
  saveSettings(); saveStories();
  state.editing = null;
  toast('नमूना डेटा लोड हो गया।');
  renderShell();
}

/* =====================================================================
   EVENT DELEGATION
   ===================================================================== */
document.addEventListener('click',(e)=>{
  const t = e.target.closest('[data-tab],[data-action],[data-edit],[data-delete],[data-duplicate],[data-toggle-publish],[data-goto],[data-ch-up],[data-ch-down],[data-ch-del],[data-sub-add],[data-sub-up],[data-sub-down],[data-sub-del],[data-block-add-p],[data-block-add-img],[data-block-up],[data-block-down],[data-block-del],[data-block-replace],[data-del-cat],[data-delete-img]');
  if(!t) return;

  // Tabs
  if(t.dataset.tab){
    state.tab = t.dataset.tab;
    state.editing = null;
    renderShell();
    return;
  }

  // Go to tab
  if(t.dataset.goto){
    state.tab = t.dataset.goto;
    renderShell();
    return;
  }

  // Actions
  if(t.dataset.action){
    const a = t.dataset.action;
    if(a==='new-story'){
      state.editing = {story:newStory(), isNew:true};
      renderShell();
    }
    else if(a==='preview-site'){ openPreview(); }
    else if(a==='close-preview'){ closePreview(); }
    else if(a==='editor-save'){ editorSave(); }
    else if(a==='editor-cancel'){ editorCancel(); }
    else if(a==='editor-preview'){ openPreview(); }
    else if(a==='save-settings'){ saveSettings(); toast('सेटिंग्स सहेजी गईं'); }
    else if(a==='pick-cover'){
      state._uploadTarget = {kind:'cover'};
      const fi = $('#fileInput'); fi.value=''; fi.click();
    }
    else if(a==='remove-cover'){
      if(state.editing&&confirm('आवरण चित्र हटाएँ?')){
        state.editing.story.coverImageId = null;
        renderShell();
      }
    }
    else if(a==='chapter-add'){
      if(!state.editing) return;
      const n = state.editing.story.chapters.length+1;
      state.editing.story.chapters.push({
        id:uid('ch'), title:'अध्याय '+n,
        subchapters:[{id:uid('sb'),title:'उप-अध्याय '+n+'.1',blocks:[{type:'p',text:''}]}]
      });
      renderShell();
    }
    else if(a==='add-cat'){
      const inp = $('#newCatInput');
      const name = inp?inp.value.trim():'';
      if(!name){toast('नाम लिखें');return}
      if(state.settings.categories.includes(name)){toast('पहले से मौजूद है');return}
      state.settings.categories.push(name);
      saveSettings();
      renderShell();
      toast('श्रेणी जोड़ी गई');
    }
    else if(a==='export-json'){ exportJSON(); }
    else if(a==='reset-all'){ resetAll(); }
    return;
  }

  // Edit story
  if(t.dataset.edit){
    const s = state.stories.find(x=>x.id===t.dataset.edit);
    if(s){ state.editing = {story:clone(s),isNew:false}; renderShell(); }
    return;
  }

  // Delete story
  if(t.dataset.delete){
    const s = state.stories.find(x=>x.id===t.dataset.delete);
    if(!s) return;
    if(!confirm(`"${s.title}" को स्थायी रूप से हटाएँ?`)) return;
    state.stories = state.stories.filter(x=>x.id!==t.dataset.delete);
    saveStories();
    renderShell();
    toast('कहानी हटा दी गई');
    return;
  }

  // Duplicate
  if(t.dataset.duplicate){
    const s = state.stories.find(x=>x.id===t.dataset.duplicate);
    if(!s) return;
    const c = clone(s);
    c.id = uid('story');
    c.title = (s.title||'बिना शीर्षक')+' (कॉपी)';
    c.status = 'draft';
    c.createdAt = new Date().toISOString();
    c.updatedAt = c.createdAt;
    c.views = 0; c.likes = 0;
    state.stories.unshift(c);
    saveStories();
    renderShell();
    toast('प्रतिलिपि बन गई');
    return;
  }

  // Toggle publish
  if(t.dataset.togglePublish){
    const s = state.stories.find(x=>x.id===t.dataset.togglePublish);
    if(!s) return;
    s.status = s.status==='published'?'draft':'published';
    s.updatedAt = new Date().toISOString();
    saveStories();
    renderShell();
    toast(s.status==='published'?'प्रकाशित':'अप्रकाशित');
    return;
  }

  // Chapter up/down/del
  if(t.dataset.chUp!==undefined||t.dataset.chDown!==undefined||t.dataset.chDel!==undefined){
    if(!state.editing) return;
    const ci = Number(t.dataset.chUp ?? t.dataset.chDown ?? t.dataset.chDel);
    const chs = state.editing.story.chapters;
    if(t.dataset.chUp!==undefined) moveItem(chs,ci,ci-1);
    else if(t.dataset.chDown!==undefined) moveItem(chs,ci,ci+1);
    else if(t.dataset.chDel!==undefined){
      if(!confirm('अध्याय और उसके उप-अध्याय हटाएँ?')) return;
      chs.splice(ci,1);
    }
    renderShell(); return;
  }

  // Subchapter add
  if(t.dataset.subAdd!==undefined){
    if(!state.editing) return;
    const ci = Number(t.dataset.subAdd);
    const ch = state.editing.story.chapters[ci];
    if(!ch) return;
    const n = ch.subchapters.length+1;
    ch.subchapters.push({id:uid('sb'),title:'उप-अध्याय '+(ci+1)+'.'+n,blocks:[{type:'p',text:''}]});
    renderShell(); return;
  }

  // Subchapter up/down/del
  if(t.dataset.subUp!==undefined||t.dataset.subDown!==undefined||t.dataset.subDel!==undefined){
    if(!state.editing) return;
    const parts = String(t.dataset.subUp ?? t.dataset.subDown ?? t.dataset.subDel).split('.');
    const ci=Number(parts[0]),si=Number(parts[1]);
    const sb = state.editing.story.chapters[ci].subchapters;
    if(t.dataset.subUp!==undefined) moveItem(sb,si,si-1);
    else if(t.dataset.subDown!==undefined) moveItem(sb,si,si+1);
    else if(t.dataset.subDel!==undefined){
      if(!confirm('उप-अध्याय हटाएँ?')) return;
      sb.splice(si,1);
    }
    renderShell(); return;
  }

  // Block add paragraph
  if(t.dataset.blockAddP!==undefined){
    if(!state.editing) return;
    const [ci,si] = String(t.dataset.blockAddP).split('.').map(Number);
    state.editing.story.chapters[ci].subchapters[si].blocks.push({type:'p',text:''});
    renderShell(); return;
  }

  // Block add image
  if(t.dataset.blockAddImg!==undefined){
    const [ci,si] = String(t.dataset.blockAddImg).split('.').map(Number);
    state._uploadTarget = {kind:'block',ci,si};
    const fi = $('#fileInput'); fi.value=''; fi.click();
    return;
  }

  // Block up/down/del/replace
  if(t.dataset.blockUp!==undefined||t.dataset.blockDown!==undefined||
     t.dataset.blockDel!==undefined||t.dataset.blockReplace!==undefined){
    if(!state.editing) return;
    const key = t.dataset.blockUp ?? t.dataset.blockDown ?? t.dataset.blockDel ?? t.dataset.blockReplace;
    const [ci,si,bi] = String(key).split('.').map(Number);

    if(t.dataset.blockReplace!==undefined){
      state._uploadTarget = {kind:'block',ci,si,bi};
      const fi = $('#fileInput'); fi.value=''; fi.click();
      return;
    }
    const blocks = state.editing.story.chapters[ci].subchapters[si].blocks;
    if(t.dataset.blockUp!==undefined) moveItem(blocks,bi,bi-1);
    else if(t.dataset.blockDown!==undefined) moveItem(blocks,bi,bi+1);
    else if(t.dataset.blockDel!==undefined) blocks.splice(bi,1);
    renderShell(); return;
  }

  // Delete category
  if(t.dataset.delCat!==undefined){
    const idx = Number(t.dataset.delCat);
    const cats = state.settings.categories;
    if(cats.length<=1){toast('कम से कम एक श्रेणी आवश्यक');return}
    const name = cats[idx];
    const used = state.stories.filter(s=>s.category===name).length;
    const msg = used ? `"${name}" में ${used} कहानियाँ हैं। पहली श्रेणी में स्थानांतरित करके हटाएँ?` : `"${name}" हटाएँ?`;
    if(!confirm(msg)) return;
    cats.splice(idx,1);
    const fb = cats[0];
    state.stories.forEach(s=>{if(s.category===name) s.category=fb});
    saveSettings(); saveStories();
    renderShell();
    toast('श्रेणी हटाई गई');
    return;
  }

  // Delete image
  if(t.dataset.deleteImg!==undefined){
    const id = t.dataset.deleteImg;
    const used = countImageUsage(id);
    const msg = used ? `यह चित्र ${used} जगह उपयोग हो रहा है। हटाएँ?` : 'चित्र हटाएँ?';
    if(!confirm(msg)) return;
    (async()=>{
      try{
        if(db) await dbDelete(id);
        const u = imageURLs.get(id);
        if(u){URL.revokeObjectURL(u);imageURLs.delete(id)}
        renderShell();
        toast('चित्र हटाया गया');
      }catch(e){toast('त्रुटि')}
    })();
    return;
  }
});

/* Input events */
document.addEventListener('input',(e)=>{
  const t = e.target;

  // Two-way bindings
  if(t.dataset.bind && state.editing){
    setPath(state.editing.story, t.dataset.bind, t.value);
    return;
  }
  if(t.dataset.setting){
    setPath(state.settings, t.dataset.setting, t.value);
    return;
  }
  if(t.id==='storySearch'){
    state.search = t.value;
    const v=$('#view'); if(v&&state.tab==='stories') v.innerHTML = renderStories();
    return;
  }
});

/* Change events */
document.addEventListener('change',(e)=>{
  const t = e.target;

  if(t.dataset.setting && t.type==='checkbox'){
    setPath(state.settings, t.dataset.setting, t.checked);
    return;
  }

  if(t.id==='storyFilter'){
    state.filter = t.value;
    const v=$('#view'); if(v&&state.tab==='stories') v.innerHTML = renderStories();
    return;
  }
  if(t.id==='storySort'){
    state.sort = t.value;
    const v=$('#view'); if(v&&state.tab==='stories') v.innerHTML = renderStories();
    return;
  }

  if(t.dataset.catIndex!==undefined){
    const idx = Number(t.dataset.catIndex);
    const oldName = state.settings.categories[idx];
    const newName = t.value.trim();
    if(!newName){toast('नाम खाली नहीं हो सकता');t.value=oldName;return}
    if(newName===oldName) return;
    if(state.settings.categories.includes(newName)){toast('पहले से मौजूद');t.value=oldName;return}
    state.settings.categories[idx] = newName;
    state.stories.forEach(s=>{if(s.category===oldName) s.category=newName});
    saveSettings(); saveStories();
    renderShell();
    toast('श्रेणी बदली गई');
    return;
  }

  if(t.id==='fileInput'){
    const f = t.files && t.files[0];
    const target = state._uploadTarget;
    state._uploadTarget = null;
    if(f && target) uploadImage(f,target);
    return;
  }

  if(t.id==='importFile'){
    const f = t.files && t.files[0];
    t.value='';
    if(f) importJSON(f);
    return;
  }
});

/* Keyboard */
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if($('#prevOverlay')) closePreview();
  }
});

/* =====================================================================
   BOOTSTRAP
   ===================================================================== */
async function init(){
  loadSettings();
  loadStories();

  try{ db = await openDB(); }
  catch(e){ db=null; console.warn('IndexedDB unavailable',e); }

  // Seed on first visit
  if(state.stories.length===0){
    state.stories = sampleStories();
    saveStories();
  }

  await loadAllImages();

  // Update header brand
  const b=$('#brandLink');
  if(b) b.innerHTML = esc(state.settings.brandMain)+' <span>'+esc(state.settings.brandAccent)+'</span>';

  renderShell();
}

init();

})();
